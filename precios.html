/* ═══════════════════════════════════════
   REPORTAR PRECIO (single screen, progressive)
   ═══════════════════════════════════════ */
function Rep({back}){
  const[prod,sp]=useState(null);
  const[psq,sps]=useState("");
  const[showList,ssl]=useState(false);
  const[acceso,sac]=useState("");
  const[depto,sde]=useState("");
  const[dist,sdi]=useState("");
  const[um,sum]=useState("");
  const[dosis,sdo]=useState("");
  const[precio,spc]=useState("");
  const[ok,sok]=useState(false);
  const bottomRef=useRef(null);

  useEffect(()=>{if(bottomRef.current)bottomRef.current.scrollIntoView({behavior:"smooth"})},[prod,acceso,depto,dist,um,precio]);

  const filtered=psq.length>0?COMP_ALL.filter(p=>p.n.toLowerCase().includes(psq.toLowerCase())):COMP_ALL;
  const distritos=depto?DEPTOS[depto]||[]:[];
  const costoHa=precio&&dosis?(parseFloat(precio)*parseFloat(dosis)).toFixed(2):"";

  if(ok) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",padding:40,textAlign:"center",background:"#f5f5f5"}}>
    <div style={{fontSize:60,marginBottom:20}}>✅</div>
    <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>Precio reportado</div>
    <div style={{fontSize:14,color:"#888",marginBottom:6}}><strong>{prod.n}</strong> ({prod.e})</div>
    <div style={{fontSize:18,fontWeight:700,color:"#36398E",marginBottom:4}}>USD {precio} / {um}</div>
    <div style={{fontSize:13,color:"#999",marginBottom:24}}>{acceso} · {dist}, {depto}</div>
    <button onClick={()=>{sp(null);sac("");sde("");sdi("");sum("");sdo("");spc("");sok(false)}} style={{background:"#36398E",color:"#fff",border:"none",borderRadius:12,padding:"14px 24px",fontWeight:700,fontSize:14,cursor:"pointer",marginBottom:10}}>+ Reportar otro</button>
    <button onClick={back} style={{background:"#fff",color:"#36398E",border:"1px solid #36398E",borderRadius:12,padding:"14px 24px",fontWeight:700,fontSize:14,cursor:"pointer"}}>Volver al inicio</button>
  </div>;

  return <div style={{minHeight:"100vh",background:"#f5f5f5"}}>
    <div style={S.hd}><button style={S.hb} onClick={back}>←</button><div style={S.ht}>Reportar Precio 💰</div></div>
    <div style={{padding:16}}>

      {/* 1. PRODUCTO */}
      <div style={S.sec}>
        <div style={S.slab}><span style={S.snum}>1</span> Producto de la competencia</div>
        {prod
          ? <div style={S.sel} onClick={()=>{sp(null);sps("")}}>
              <div><div style={{fontSize:15,fontWeight:600}}>{prod.n}</div><div style={{fontSize:12,color:"#777",marginTop:2}}>{prod.e} · {prod.l}</div></div>
              <span style={{color:"#36398E",fontWeight:600,fontSize:13}}>Cambiar</span>
            </div>
          : <div>
              <input style={S.inp} placeholder="Buscar producto competencia..." value={psq} onChange={e=>{sps(e.target.value);ssl(true)}} onFocus={()=>ssl(true)}/>
              {ssl && <div style={{background:"#fff",borderRadius:10,border:"1px solid #e0e0e0",maxHeight:250,overflowY:"auto",marginTop:4}}>
                {filtered.slice(0,15).map((p,i)=>
                  <div key={p.n+i} onClick={()=>{sp(p);sps("");ssl(false)}}
                    style={{padding:"12px 14px",borderBottom:"1px solid #f0f0f0",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontSize:14,fontWeight:600,color:"#1a1a1a"}}>{p.n}</div><div style={{fontSize:11,color:"#999"}}>{p.e} · {p.l}</div></div>
                  </div>
                )}
                {filtered.length===0 && <div style={{padding:16,textAlign:"center",color:"#999",fontSize:13}}>Sin resultados</div>}
              </div>}
            </div>
        }
      </div>

      {/* 2. ACCESO */}
      {prod && <div className="fade-in" style={S.sec}>
        <div style={S.slab}><span style={S.snum}>2</span> Acceso de mercado</div>
        <div style={{display:"flex",gap:8}}>
          {ACCESOS.map(a=>
            <button key={a} style={S.ch(acceso===a)} onClick={()=>sac(a)}>{a}</button>
          )}
        </div>
      </div>}

      {/* 3. UBICACIÓN */}
      {acceso && <div className="fade-in" style={S.sec}>
        <div style={S.slab}><span style={S.snum}>3</span> Ubicación</div>
        <div style={{fontSize:12,color:"#999",marginBottom:8}}>Departamento</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
          {Object.keys(DEPTOS).map(d=>
            <button key={d} style={S.ch(depto===d)} onClick={()=>{sde(d);sdi("")}}>{d}</button>
          )}
        </div>
        {depto && <>
          <div style={{fontSize:12,color:"#999",marginBottom:8}}>Distrito</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {distritos.map(d=>
              <button key={d} style={S.ch(dist===d)} onClick={()=>sdi(d)}>{d}</button>
            )}
          </div>
        </>}
      </div>}

      {/* 4. UM + DOSIS */}
      {dist && <div className="fade-in" style={S.sec}>
        <div style={S.slab}><span style={S.snum}>4</span> Unidad de medida</div>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {UMS.map(u=>
            <button key={u} style={S.ch(um===u)} onClick={()=>sum(u)}>{u}</button>
          )}
        </div>
        {um && <>
          <div style={{fontSize:12,color:"#999",marginBottom:6}}>Dosis (opcional, si la sabés)</div>
          <input style={S.inp} type="number" step="0.01" placeholder="Ej: 0.3" value={dosis} onChange={e=>sdo(e.target.value)}/>
        </>}
      </div>}

      {/* 5. PRECIO */}
      {um && <div className="fade-in" style={S.sec}>
        <div style={S.slab}><span style={S.snum}>5</span> Precio en USD</div>
        <div style={{background:"#fff",borderRadius:12,padding:16,border:"1px solid #e0e0e0"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:22,fontWeight:700,color:"#36398E"}}>USD</span>
            <input style={{...S.inp,fontSize:26,fontWeight:700,flex:1,textAlign:"right"}} type="number" step="0.01" placeholder="0.00" value={precio} onChange={e=>spc(e.target.value)}/>
          </div>
          <div style={{fontSize:12,color:"#999",marginTop:4,textAlign:"right"}}>por {um}</div>
        </div>
        {costoHa && <div style={{background:"#EDE7F6",borderRadius:10,padding:12,border:"1px solid #36398E",marginTop:8}}>
          <div style={{fontSize:12,color:"#36398E",fontWeight:600}}>Costo/Ha estimado: <strong>USD {costoHa}</strong></div>
        </div>}
      </div>}

      {/* 6. FOTO + ENVIAR */}
      {precio && <div className="fade-in" style={S.sec}>
        <div style={S.slab}><span style={S.snum}>6</span> Foto <span style={{fontSize:11,fontWeight:400,color:"#999"}}>(opcional)</span></div>
        <div style={{background:"#fff",borderRadius:12,border:"2px dashed #e0e0e0",padding:24,textAlign:"center",color:"#bbb",fontSize:14,marginBottom:16}}>
          📷 Tocar para sacar foto<br/><span style={{fontSize:11}}>(Demo: deshabilitado)</span>
        </div>

        {/* Resumen */}
        <div style={{background:"#fff",borderRadius:12,padding:16,border:"1px solid #e0e0e0",marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:"#555",marginBottom:8}}>📝 Resumen</div>
          <div style={{fontSize:15,fontWeight:700}}>{prod.n} <span style={{fontSize:12,fontWeight:400,color:"#777"}}>({prod.e})</span></div>
          <div style={{fontSize:18,fontWeight:700,color:"#36398E",marginTop:4}}>USD {precio} / {um}</div>
          <div style={{fontSize:12,color:"#777",marginTop:4}}>{acceso} · {dist}, {depto}</div>
          {dosis && <div style={{fontSize:12,color:"#777"}}>Dosis: {dosis} · Costo/ha: USD {costoHa}</div>}
        </div>

        <button onClick={()=>sok(true)} style={S.gb}>✓ Enviar reporte</button>
      </div>}

      <div ref={bottomRef}/>
    </div>
    <div style={S.dm}>Demo — Syngenta Paraguay</div>
  </div>;
}

/* ═══════════════════════════════════════
   MIS REPORTES
   ═══════════════════════════════════════ */
function Hist({back}){
  return <div style={{minHeight:"100vh",background:"#f5f5f5"}}>
    <div style={S.hd}><button style={S.hb} onClick={back}>←</button><div style={{...S.ht,textAlign:"center"}}>Mis Reportes</div></div>
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:8}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:13,color:"#999"}}>{REPORTES.length} reportes</span>
        <span style={{fontSize:12,color:"#F59E0B",fontWeight:600}}>{REPORTES.filter(r=>r.estado==="pendiente").length} pendientes</span>
      </div>
      {REPORTES.map(r=>
        <div key={r.id} style={{background:"#fff",borderRadius:12,padding:14,border:"1px solid #e0e0e0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <span style={{fontSize:14,fontWeight:700}}>{r.prod}</span>
            <span style={S.es(r.estado==="validado"?"#00A651":"#F59E0B")}>{r.estado==="validado"?"✓ Validado":"⏳ Pendiente"}</span>
          </div>
          <div style={{fontSize:16,fontWeight:700,color:"#36398E"}}>USD {r.precio} <span style={{fontSize:12,fontWeight:400,color:"#999"}}>/ {r.um}</span></div>
          <div style={{fontSize:12,color:"#555",marginTop:4}}>{r.acceso} · {r.dist}, {r.depto}</div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
            <span style={{fontSize:10,background:"#f0f0f0",padding:"2px 8px",borderRadius:10,color:"#666"}}>{r.emp} · {r.linea}</span>
            <span style={{fontSize:11,color:"#999"}}>{r.fecha}</span>
          </div>
        </div>
      )}
    </div>
    <div style={S.dm}>Demo — Syngenta Paraguay</div>
  </div>;
}

/* ═══════════════════════════════════════
   COMPARADOR COSTO/HA — VS
   SYN: precio + dosis precargados
   Competencia: DTM tipea precio/L y dosis
   ═══════════════════════════════════════ */
const SYN_P=[
  {n:"PRIORI XTRA",l:"FUN",d:0.4,p:32,u:"L"},{n:"PRIORI XTRA GOLD",l:"FUN",d:0.4,p:38,u:"L"},{n:"AMISTAR TOP",l:"FUN",d:0.3,p:35,u:"L"},
  {n:"MAZEN",l:"FUN",d:0.2,p:55,u:"kg"},{n:"MAZEN FORTE",l:"FUN",d:0.45,p:42,u:"L"},{n:"CERATAVO",l:"FUN",d:0.2,p:58,u:"kg"},
  {n:"CERATAVO FORTE",l:"FUN",d:0.45,p:44,u:"L"},{n:"MIRAVIS FORTE",l:"FUN",d:0.9,p:28,u:"L"},{n:"CYPRESS",l:"FUN",d:0.4,p:26,u:"L"},
  {n:"VALIVIS",l:"FUN",d:0.4,p:30,u:"L"},{n:"SCORE",l:"FUN",d:0.3,p:24,u:"L"},{n:"BRAVONIL",l:"FUN",d:1.0,p:12,u:"L"},
  {n:"BRAVONIL TOP",l:"FUN",d:1.5,p:14,u:"L"},{n:"TRINITY",l:"FUN",d:2.25,p:8,u:"L"},{n:"SPYRALE",l:"FUN",d:0.8,p:22,u:"L"},
  {n:"SYMETRY",l:"FUN",d:0.5,p:34,u:"L"},{n:"ALTO ELITE",l:"FUN",d:1.0,p:18,u:"L"},{n:"SEEKER",l:"FUN",d:0.3,p:36,u:"L"},
  {n:"KARATE ZEON",l:"INS",d:0.1,p:28,u:"L"},{n:"ENGEO",l:"INS",d:0.2,p:32,u:"L"},{n:"ENGEO PLENO",l:"INS",d:0.25,p:30,u:"L"},
  {n:"AMPLIGO",l:"INS",d:0.12,p:65,u:"L"},{n:"MATCH",l:"INS",d:0.1,p:45,u:"L"},{n:"PROCLAIM FIT",l:"INS",d:0.05,p:120,u:"kg"},
  {n:"ACTARA 75",l:"INS",d:0.05,p:110,u:"kg"},{n:"ENDIGO",l:"INS",d:0.2,p:36,u:"L"},{n:"CAREXO",l:"INS",d:0.1,p:48,u:"L"},
  {n:"VERDAVIS",l:"INS",d:0.2,p:34,u:"L"},{n:"FENSORAX",l:"INS",d:0.2,p:38,u:"L"},
  {n:"FLEX",l:"HERB",d:1.0,p:15,u:"L"},{n:"DUAL GOLD",l:"HERB",d:1.8,p:14,u:"L"},{n:"GESAPRIM",l:"HERB",d:2.0,p:8,u:"kg"},
  {n:"TRAXOS PLUS",l:"HERB",d:0.4,p:42,u:"L"},{n:"EDDUS",l:"HERB",d:2.5,p:9,u:"L"},
  {n:"CRUISER",l:"SC",d:0.1,p:52,u:"L"},{n:"FORTENZA",l:"SC",d:0.02,p:280,u:"L"},{n:"FORTENZA MAXX",l:"SC",d:0.2,p:65,u:"L"},
  {n:"MAXIM XL",l:"SC",d:0.1,p:38,u:"L"},{n:"MAXIM ADVANCED",l:"SC",d:0.1,p:42,u:"L"},
  {n:"VIBRANCE",l:"SC",d:0.06,p:85,u:"L"},{n:"VIBRANCE MAXX",l:"SC",d:0.06,p:92,u:"L"},{n:"VIBRANCE INTEGRAL",l:"SC",d:0.06,p:88,u:"L"},
  {n:"VICTRATO",l:"SC",d:0.02,p:320,u:"L"},
];

function Calc({back}){
  const[synProd,ssp]=useState(null);
  const[synQ,ssq]=useState("");
  const[synO,sso]=useState(false);
  const[compProd,scp]=useState(null);
  const[compQ,scq]=useState("");
  const[compO,sco]=useState(false);
  const[compPrecio,scpr]=useState("");
  const[compDosis,scdo]=useState("");

  const synF=synQ?SYN_P.filter(p=>p.n.toLowerCase().includes(synQ.toLowerCase())).slice(0,10):SYN_P.slice(0,10);
  const compF=compQ?COMP_ALL.filter(p=>p.n.toLowerCase().includes(compQ.toLowerCase())).slice(0,10):[];

  const synHa=synProd?(synProd.d*synProd.p).toFixed(2):"";
  const compHa=compPrecio&&compDosis?(parseFloat(compPrecio)*parseFloat(compDosis)).toFixed(2):"";
  const diff=synHa&&compHa?(parseFloat(compHa)-parseFloat(synHa)).toFixed(2):"";
  const synWins=diff&&parseFloat(diff)>0;
  const compWins=diff&&parseFloat(diff)<0;

  return <div style={{minHeight:"100vh",background:"#f5f5f5"}}>
    <div style={S.hd}><button style={S.hb} onClick={back}>←</button><div style={{...S.ht,textAlign:"center"}}>Comparador Costo/Ha</div></div>
    <div style={{padding:16}}>

      {/* ── SYNGENTA (precargado) ── */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:700,color:"#00A651",marginBottom:8,display:"flex",alignItems:"center",gap:6}}>🟢 SYNGENTA <span style={{fontSize:10,fontWeight:400,color:"#999"}}>(datos precargados)</span></div>
        {synProd
          ? <div style={{background:"#E8F5E9",borderRadius:12,padding:14,border:"1px solid #00A651"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div style={{fontSize:16,fontWeight:700,color:"#00A651"}}>{synProd.n}</div>
                <button onClick={()=>ssp(null)} style={{background:"none",border:"none",color:"#00A651",fontWeight:600,cursor:"pointer",fontSize:12}}>Cambiar</button>
              </div>
              <div style={{display:"flex",gap:8}}>
                <div style={{flex:1,background:"#fff",borderRadius:8,padding:10,textAlign:"center"}}>
                  <div style={{fontSize:10,color:"#999"}}>Precio</div>
                  <div style={{fontSize:16,fontWeight:700}}>USD {synProd.p}<span style={{fontSize:11,fontWeight:400}}>/{synProd.u}</span></div>
                </div>
                <div style={{flex:1,background:"#fff",borderRadius:8,padding:10,textAlign:"center"}}>
                  <div style={{fontSize:10,color:"#999"}}>Dosis</div>
                  <div style={{fontSize:16,fontWeight:700}}>{synProd.d} {synProd.u}/ha</div>
                </div>
              </div>
              <div style={{background:"#fff",borderRadius:8,padding:12,textAlign:"center",marginTop:8}}>
                <div style={{fontSize:10,color:"#00A651"}}>Costo aplicación/ha</div>
                <div style={{fontSize:26,fontWeight:700,color:"#00A651"}}>USD {synHa}</div>
              </div>
            </div>
          : <div>
              <input style={S.inp} placeholder="Buscar producto Syngenta..." value={synQ} onChange={e=>{ssq(e.target.value);sso(true)}} onFocus={()=>sso(true)}/>
              {synO && <div style={{background:"#fff",borderRadius:10,border:"1px solid #e0e0e0",maxHeight:240,overflowY:"auto",marginTop:-6}}>
                {synF.map(p=>
                  <div key={p.n} onClick={()=>{ssp(p);ssq("");sso(false)}} style={{padding:"11px 14px",borderBottom:"1px solid #f0f0f0",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontSize:14,fontWeight:600}}>{p.n}</div><div style={{fontSize:10,color:"#999"}}>{p.l} · {p.d} {p.u}/ha</div></div>
                    <span style={{fontSize:12,color:"#00A651",fontWeight:700}}>USD {p.p}/{p.u}</span>
                  </div>
                )}
              </div>}
            </div>
        }
      </div>

      {/* ── COMPETENCIA (DTM tipea) ── */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:700,color:"#e53935",marginBottom:8,display:"flex",alignItems:"center",gap:6}}>🔴 COMPETENCIA <span style={{fontSize:10,fontWeight:400,color:"#999"}}>(ingresá precio y dosis)</span></div>
        <div style={{background:"#fff",borderRadius:12,padding:14,border:"1px solid #e53935"}}>
          {compProd
            ? <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div><div style={{fontSize:15,fontWeight:700,color:"#e53935"}}>{compProd.n}</div><div style={{fontSize:10,color:"#999"}}>{compProd.e} · {compProd.l}</div></div>
                <button onClick={()=>{scp(null);scpr("");scdo("")}} style={{background:"none",border:"none",color:"#e53935",fontWeight:600,cursor:"pointer",fontSize:12}}>Cambiar</button>
              </div>
            : <div>
                <input style={{...S.inp,marginBottom:4}} placeholder="Buscar producto competencia..." value={compQ} onChange={e=>{scq(e.target.value);sco(true)}} onFocus={()=>sco(true)}/>
                {compO&&compQ&&<div style={{background:"#fff",borderRadius:8,border:"1px solid #e0e0e0",maxHeight:160,overflowY:"auto",marginBottom:4}}>
                  {compF.map((p,i)=>
                    <div key={p.n+i} onClick={()=>{scp(p);scq("");sco(false)}} style={{padding:"10px 14px",borderBottom:"1px solid #f0f0f0",cursor:"pointer"}}>
                      <span style={{fontSize:13,fontWeight:600}}>{p.n}</span>
                      <span style={{fontSize:10,color:"#999",marginLeft:6}}>{p.e}</span>
                    </div>
                  )}
                </div>}
              </div>
          }
          {compProd && <div className="fade-in">
            <div style={{display:"flex",gap:8}}>
              <div style={{flex:1}}>
                <div style={{fontSize:11,color:"#999",marginBottom:4}}>Precio USD/L</div>
                <input style={{...S.inp,fontSize:16,fontWeight:700,textAlign:"center"}} type="number" step="0.01" placeholder="0.00" value={compPrecio} onChange={e=>scpr(e.target.value)}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:11,color:"#999",marginBottom:4}}>Dosis/ha</div>
                <input style={{...S.inp,fontSize:16,fontWeight:700,textAlign:"center"}} type="number" step="0.01" placeholder="0.00" value={compDosis} onChange={e=>scdo(e.target.value)}/>
              </div>
            </div>
            {compHa && <div style={{background:"#FFEBEE",borderRadius:8,padding:12,textAlign:"center",marginTop:4}}>
              <div style={{fontSize:10,color:"#e53935"}}>Costo aplicación/ha</div>
              <div style={{fontSize:26,fontWeight:700,color:"#e53935"}}>USD {compHa}</div>
            </div>}
          </div>}
        </div>
      </div>

      {/* ── RESULTADO VS ── */}
      {diff && <div className="fade-in">
        <div style={{background:synWins?"linear-gradient(135deg, #00A651, #2E7D32)":compWins?"linear-gradient(135deg, #e53935, #c62828)":"linear-gradient(135deg, #36398E, #5C5FBF)",borderRadius:14,padding:20,textAlign:"center"}}>
          <div style={{fontSize:11,color:"rgba(255,255,255,.7)",textTransform:"uppercase",letterSpacing:1}}>Diferencia por hectárea</div>
          <div style={{fontSize:34,fontWeight:700,color:"#fff",marginTop:6}}>USD {Math.abs(parseFloat(diff)).toFixed(2)}</div>
          <div style={{fontSize:15,fontWeight:600,color:"#fff",marginTop:4}}>
            {synWins?"✅ Syngenta es más económico":compWins?"Competencia es más económico":"Mismo costo por hectárea"}
          </div>
          <div style={{fontSize:11,color:"rgba(255,255,255,.6)",marginTop:10,lineHeight:1.6}}>
            {synProd?.n}: USD {synHa}/ha ({synProd?.d} {synProd?.u}/ha × ${synProd?.p}/{synProd?.u})<br/>
            {compProd?.n}: USD {compHa}/ha ({compDosis}/ha × ${compPrecio}/L)
          </div>
        </div>
      </div>}

    </div>
    <div style={S.dm}>Demo — Syngenta Paraguay</div>
  </div>;
}

/* ═══════════════════════════════════════
   MAPA DE PRECIOS
   ═══════════════════════════════════════ */
function MapaP({back}){
  const[vista,sv]=useState("tabla");
  const[filtro,sf]=useState("");
  const filtered=filtro?MAPA_DATA.filter(d=>d.emp.toLowerCase().includes(filtro.toLowerCase())||d.prod.toLowerCase().includes(filtro.toLowerCase())):MAPA_DATA;

  return <div style={{minHeight:"100vh",background:"#f5f5f5"}}>
    <div style={S.hd}><button style={S.hb} onClick={back}>←</button><div style={{...S.ht,textAlign:"center"}}>Mapa de Precios</div></div>
    <div style={{display:"flex",gap:0,background:"#fff",borderBottom:"1px solid #f0f0f0"}}>
      {[["tabla","📊 Tabla"],["mapa","📍 Mapa"],["time","📈 Timeline"]].map(([k,l])=>
        <button key={k} onClick={()=>sv(k)} style={{flex:1,padding:12,border:"none",background:vista===k?"#EDE7F6":"#fff",color:vista===k?"#36398E":"#999",fontWeight:vista===k?700:400,fontSize:13,cursor:"pointer",borderBottom:vista===k?"2px solid #36398E":"2px solid transparent"}}>{l}</button>
      )}
    </div>
    <div style={{padding:16}}>
      <input style={{...S.inp,marginBottom:12}} placeholder="Filtrar por producto o empresa..." value={filtro} onChange={e=>sf(e.target.value)}/>

      {vista==="tabla" && <div>{filtered.map((d,i)=>
        <div key={i} style={{background:"#fff",borderRadius:12,padding:14,marginBottom:8,border:"1px solid #e0e0e0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <span style={{fontSize:14,fontWeight:700}}>{d.prod}</span>
            <span style={{fontSize:10,background:"#f0f0f0",padding:"2px 8px",borderRadius:10,color:"#666"}}>{d.emp}</span>
          </div>
          <div style={{display:"flex",gap:12,marginTop:8}}>
            {[["Prom","#36398E",d.prom],["Min","#00A651",d.min],["Max","#e53935",d.max],["Rep.","#555",d.rep]].map(([l,c,v])=>
              <div key={l} style={{textAlign:"center",flex:1}}>
                <div style={{fontSize:10,color:"#999"}}>{l}</div>
                <div style={{fontSize:l==="Prom"?16:14,fontWeight:l==="Prom"?700:600,color:c}}>{l!=="Rep."?"USD ":""}{v}</div>
              </div>
            )}
          </div>
        </div>
      )}</div>}

      {vista==="mapa" && <div>
        <div style={{background:"#fff",borderRadius:14,border:"1px solid #e0e0e0",overflow:"hidden"}}>
          <div style={{background:"linear-gradient(135deg,#E8F5E9,#C8E6C9)",padding:30,position:"relative",minHeight:250}}>
            <div style={{fontSize:12,color:"#555",marginBottom:10,fontWeight:600,textAlign:"center"}}>Paraguay — Zona productiva</div>
            <div style={{position:"absolute",top:"25%",right:"25%",background:"#36398E",color:"#fff",padding:"6px 12px",borderRadius:20,fontSize:12,fontWeight:700,boxShadow:"0 2px 8px rgba(0,0,0,.2)"}}>Alto Paraná<br/><span style={{fontSize:10,fontWeight:400}}>Prom. $43/L FUN</span></div>
            <div style={{position:"absolute",top:"58%",right:"20%",background:"#36398E",color:"#fff",padding:"6px 12px",borderRadius:20,fontSize:12,fontWeight:700,boxShadow:"0 2px 8px rgba(0,0,0,.2)"}}>Itapúa<br/><span style={{fontSize:10,fontWeight:400}}>Prom. $37/L FUN</span></div>
            <div style={{position:"absolute",top:"38%",left:"10%",background:"#36398E",color:"#fff",padding:"6px 12px",borderRadius:20,fontSize:12,fontWeight:700,boxShadow:"0 2px 8px rgba(0,0,0,.2)"}}>Caaguazú<br/><span style={{fontSize:10,fontWeight:400}}>Prom. $35/L FUN</span></div>
          </div>
          <div style={{padding:14,fontSize:12,color:"#999"}}>Precio promedio fungicidas por departamento. {MAPA_DATA.reduce((a,d)=>a+d.rep,0)} reportes.</div>
        </div>
      </div>}

      {vista==="time" && <div>
        {[{n:"Cripton Xpro",e:"Bayer",c:"#36398E",d:[{m:"Ene",p:40},{m:"Feb",p:42},{m:"Mar",p:41},{m:"Abr",p:44},{m:"May",p:43}]},
          {n:"Vessarya",e:"Corteva",c:"#8B5CF6",d:[{m:"Ene",p:35},{m:"Feb",p:36},{m:"Mar",p:38},{m:"Abr",p:37},{m:"May",p:37}]},
          {n:"Opera",e:"BASF",c:"#F59E0B",d:[{m:"Ene",p:32},{m:"Feb",p:33},{m:"Mar",p:34},{m:"Abr",p:35},{m:"May",p:34}]}
        ].map(t=>
          <div key={t.n} style={{background:"#fff",borderRadius:14,padding:16,border:"1px solid #e0e0e0",marginBottom:10}}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>{t.n} <span style={{fontSize:11,fontWeight:400,color:"#999"}}>({t.e})</span></div>
            {t.d.map(d=>
              <div key={d.m} style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                <span style={{fontSize:12,color:"#999",width:30}}>{d.m}</span>
                <div style={{flex:1,background:"#f0f0f0",borderRadius:6,height:22}}>
                  <div style={{background:t.c,borderRadius:6,height:22,width:(d.p/55*100)+"%",display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:8}}>
                    <span style={{fontSize:10,fontWeight:700,color:"#fff"}}>${d.p}</span>
                  </div>
                </div>
              </div>
            )}
            <div style={{fontSize:10,color:"#999",marginTop:4}}>USD/L por mes — 2026</div>
          </div>
        )}
      </div>}
    </div>
    <div style={S.dm}>Demo — Syngenta Paraguay</div>
  </div>;
}

/* ═══════════════════════════════════════
   APP ROUTER
   ═══════════════════════════════════════ */
function App(){
  const[v,sv]=useState("home");
  const routes={home:Home,rep:Rep,hist:Hist,calc:Calc,mapa:MapaP};
  const Comp=routes[v];
  if(!Comp) return null;
  const props=v==="home"?{go:sv}:{back:()=>sv("home")};
  return <Comp {...props}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
