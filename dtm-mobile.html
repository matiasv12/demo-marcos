<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DTM Mobile | Syngenta PY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#e8e8e8}#root{max-width:430px;margin:0 auto;min-height:100vh;background:#f5f5f5;position:relative;border-left:1px solid #e0e0e0;border-right:1px solid #e0e0e0}input,select,textarea{font-family:inherit}::-webkit-scrollbar{display:none}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState}=React;

/* ══════════════════════════════════════════════
   CATÁLOGO REAL SYNGENTA PARAGUAY
   Solo productos del maestro proporcionado
   ══════════════════════════════════════════════ */
const P={
  FUN:["PRIME","TILT","PRIORI XTRA","AMISTAR TOP","MAZEN","MAZEN FORTE","CERATAVO","CERATAVO FORTE","PRIORI XTRA GOLD","SCORE","SCORE FLEXI","CYPRESS","VALIVIS","OCHIMA","QUANTIS","BRAVONIL","BRAVONIL TOP","TRINITY","SEEKER","SYMETRY","SPYRALE","APROVIA TURBO","SOLATENOL TECNICO","MIRAVIS FORTE","ALTO ELITE","ERIA"],
  SC:["CRUISER","FORTENZA","FORTENZA MAXX","MAXIM XL","MAXIM ADVANCED","MAXIM RFC","VIBRANCE","VIBRANCE MAXX","VIBRANCE INTEGRAL","SPECTRO","EKEY TOP","CERTICOR","CURANZA","VICTRATO","CURYOM","VERTIMEC 8.4","BIOGLOSS","RIZO LIQ","PREMAX","PRIMEPLUS","RIZODERMA MAX","RIZOLIQ DAKAR","PROTEX"],
  INS:["KARATE","KARATE ZEON","ENGEO","ENGEO PLENO","AMPLIGO","MATCH","PROCLAIM FIT","ACTARA 75","ACTARA 250","ENDIGO","CAREXO","FENSORAX","EFONEO","VERDAVIS","ELESTAL NEO","SITOLAN"],
  HERB:["FLEX","DUAL GOLD","GESAPRIM","TOPIK","TRAXOS","TRAXOS PLUS","EDDUS","TRASPECT","FILAFIR","DALEST"],
  NSH:["ZAPP","GRAMOCIL","GRAMOXONE","FARMON","REGLONE","SULFOSATO TOUCHDOWN MAX","MAGNUM"],
  PACK:["FORTENZA PACK","FORTENZA PACK MAIZ","PACK ENDIGO","PACK FORTENZA VIBRANCE MAXX","PACK FENSORAX","PACK VICTRATO","PACK VICTRATO MAXX"],
  "L&G":["ACTELLIC 500","ICON","DEMAND"],
  OTH:["AGRAL","NIMBUS","ENERGIC"]
};

const MN=[
  {l:"Nueva Visita",s:"Registra una visita ahora",i:"⚡",c:"#F59E0B",r:"wiz"},
  {l:"Mis Visitas",s:"Historial de visitas",i:"📋",c:"#3B82F6",r:"vis"},
  {l:"Mis Productores",s:"Farmers y datos cualitativos",i:"👥",c:"#00A651",r:"far"},
  {l:"Charlas",s:"Registro de capacitaciones",i:"🎓",c:"#8B5CF6",r:"cha"},
  {l:"Agenda",s:"Visitas programadas",i:"📅",c:"#EC4899",r:"age"},
  {l:"Monitoreos",s:"Seguimiento de aplicaciones",i:"🧪",c:"#06B6D4",r:"mon"},
  {l:"EUPs",s:"Ensayos comparativos en campo",i:"🌱",c:"#10B981",r:"eup"}
];

const ST=["Cliente","Cultivo","Posicionam.","Cierres","Aplicaciones","Fenología","Notas"];

const FM=[
  {id:"1",n:"Juan Benítez",e:"Estancia El Sol",d:"Itapúa",di:"Capitán Miranda",h:350,cu:["Soja","Trigo"]},
  {id:"2",n:"Roberto Schmalko",e:"Campo Norte",d:"Alto Paraná",di:"Santa Rita",h:780,cu:["Soja"]},
  {id:"3",n:"Ana Villalba",e:"Finca Santa Ana",d:"Itapúa",di:"Hohenau",h:180,cu:["Soja","Maíz"]},
  {id:"4",n:"Pedro Ramírez",e:"Agro Paraná",d:"Alto Paraná",di:"Naranjal",h:1200,cu:["Soja","Trigo","Canola"]},
  {id:"5",n:"María González",e:"La Esperanza",d:"Itapúa",di:"Bella Vista",h:520,cu:["Soja"]},
  {id:"6",n:"Diego Fernández",e:"San Miguel",d:"Caaguazú",di:"Coronel Oviedo",h:420,cu:["Soja","Maíz"]}
];

/* ═══ STYLES ═══ */
const S={
  inp:{width:"100%",padding:"11px 14px",borderRadius:10,border:"1px solid #e0e0e0",fontSize:14,outline:"none",marginBottom:10,background:"#fff",boxSizing:"border-box"},
  lb:{background:"#fff",borderRadius:12,padding:14,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2,border:"1px solid #e0e0e0",cursor:"pointer"},
  bg:o=>({padding:"4px 12px",borderRadius:20,fontSize:12,fontWeight:700,color:"#fff",background:o?"#00A651":"#e0e0e0"}),
  tb:a=>({flex:1,padding:10,borderRadius:10,border:a?"1px solid #00A651":"1px solid #e0e0e0",textAlign:"center",background:a?"#E8F5E9":"#fff",cursor:"pointer",fontSize:13,fontWeight:600,color:a?"#00A651":"#999"}),
  ch:a=>({padding:"8px 14px",borderRadius:20,border:a?"1px solid #00A651":"1px solid #e0e0e0",background:a?"#E8F5E9":"#fff",cursor:"pointer",fontSize:13,color:a?"#00A651":"#555",fontWeight:a?600:400}),
  es:c=>({display:"inline-block",padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,border:"1px solid "+c,color:c,background:c+"15"}),
  hd:{background:"#00A651",paddingTop:52,paddingBottom:14,paddingLeft:20,paddingRight:20},
  ht:{fontSize:20,fontWeight:700,color:"#fff"},
  hb:{background:"none",border:"none",color:"rgba(255,255,255,.85)",fontSize:22,cursor:"pointer",marginBottom:6,padding:0},
  dm:{textAlign:"center",padding:20,color:"#bbb",fontSize:11},
  green_btn:{width:"100%",background:"#00A651",color:"#fff",border:"none",borderRadius:12,padding:14,fontWeight:700,fontSize:14,cursor:"pointer"}
};

function td(){return new Date().toLocaleDateString("es-PY",{weekday:"long",day:"numeric",month:"long"})}

/* ═══════════════════════════════════════
   HOME
   ═══════════════════════════════════════ */
function Home({go}){
  return <div style={{minHeight:"100vh",background:"#f5f5f5",paddingBottom:40}}>
    <div style={{padding:20,paddingTop:16}}>
      {/* Header verde */}
      <div style={{background:"#00A651",margin:"-16px -20px 20px",padding:"20px 20px 16px",borderRadius:"0 0 20px 20px"}}>
        <div style={{fontSize:22,fontWeight:700,color:"#fff"}}>Hola, Carlos 👋</div>
        <div style={{fontSize:13,color:"rgba(255,255,255,.7)",marginTop:4,textTransform:"capitalize"}}>{td()}</div>
        <div style={{display:"flex",gap:8,marginTop:12}}>
          {[["54","Visitas mes"],["6","Pendientes hoy"],["2","Sin sync"]].map(([v,l])=>
            <div key={l} style={{flex:1,background:"rgba(255,255,255,.15)",borderRadius:10,padding:10,textAlign:"center"}}>
              <div style={{fontSize:18,fontWeight:700,color:"#fff"}}>{v}</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,.7)"}}>{l}</div>
            </div>
          )}
        </div>
      </div>

      {/* Menu items */}
      {MN.map(m=>
        <button key={m.r} onClick={()=>go(m.r)} style={{background:"#fff",borderRadius:14,padding:14,display:"flex",flexDirection:"row",alignItems:"center",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,.06)",cursor:"pointer",border:"none",width:"100%",textAlign:"left"}}>
          <div style={{width:46,height:46,borderRadius:13,display:"flex",alignItems:"center",justifyContent:"center",marginRight:14,fontSize:22,background:m.c+"18"}}>{m.i}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:700,color:"#1a1a1a"}}>{m.l}</div>
            <div style={{fontSize:12,color:"#888",marginTop:2}}>{m.s}</div>
          </div>
          <span style={{color:"#ccc",fontSize:16}}>›</span>
        </button>
      )}

      <button style={{marginTop:16,background:"#fff0f0",borderRadius:14,padding:16,display:"flex",flexDirection:"row",alignItems:"center",justifyContent:"center",border:"1px solid #ffcccc",cursor:"pointer",width:"100%"}}>
        <span style={{marginRight:8}}>🚪</span>
        <span style={{fontSize:14,fontWeight:700,color:"#e53935"}}>Cerrar sesión</span>
      </button>
      <div style={S.dm}>Demo con datos ficticios — Syngenta Paraguay</div>
    </div>
  </div>;
}

/* ═══════════════════════════════════════
   WIZARD: NUEVA VISITA (7 pasos)
   ═══════════════════════════════════════ */
function Wiz({back}){
  const[step,ss]=useState(0);
  const[tipo,st]=useState("soy_leader");
  const[farmer,sf]=useState(null);
  const[search,sq]=useState("");
  const[cult,sc]=useState("");
  const[camp,sm]=useState("2025/2026");
  const[pos,sp]=useState([]);
  const[psq,sps]=useState("");
  const[ci,sci]=useState({SC:{on:false,c:false,p:""},HERB:{on:false,c:false,p:""},INS:{on:false,c:false,p:""}});
  const[ap,sa]=useState({VEG:false,FUN1:false,FUN2:false,FUN3:false});
  const[pl,spl]=useState(false);
  const[fe,sfe]=useState({d:0,s:60,c:0,t:""});
  const[no,sno]=useState("");
  const[ok,sok]=useState(false);

  // Todos los productos para posicionamiento (excepto Packs, L&G, OTH)
  const allP=[...P.FUN,...P.SC,...P.INS,...P.HERB];
  const ff=FM.filter(f=>f.n.toLowerCase().includes(search.toLowerCase()));
  const dt=new Date().toISOString().split("T")[0];
  const cn=()=>{if(step===0)return!!farmer;if(step===1)return!!cult;return true};

  if(ok) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",padding:40,textAlign:"center",background:"#f5f5f5"}}>
    <div style={{fontSize:60,marginBottom:20}}>✅</div>
    <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>Visita registrada</div>
    <div style={{fontSize:14,color:"#888",marginBottom:24}}>Visita a {farmer?.n} guardada correctamente.</div>
    <button onClick={back} style={{background:"#00A651",color:"#fff",border:"none",borderRadius:12,padding:"14px 30px",fontWeight:700,fontSize:14,cursor:"pointer"}}>Volver al inicio</button>
  </div>;

  return <div style={{minHeight:"100vh",background:"#f5f5f5"}}>
    {/* Header */}
    <div style={S.hd}>
      <button style={S.hb} onClick={back}>←</button>
      <div style={S.ht}>Nueva Visita ⚡</div>
    </div>

    {/* Stepper */}
    <div style={{display:"flex",gap:4,padding:"10px 12px",background:"#fff",overflowX:"auto",borderBottom:"1px solid #f0f0f0"}}>
      {ST.map((l,i)=>
        <div key={l} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:48}}>
          <div style={{width:24,height:24,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,marginBottom:2,background:i<=step?"#00A651":"#e0e0e0",color:i<=step?"#fff":"#999"}}>{i+1}</div>
          <div style={{fontSize:8,textAlign:"center",color:i===step?"#00A651":"#999",fontWeight:i===step?600:400}}>{l}</div>
        </div>
      )}
    </div>

    <div style={{padding:18}}>

      {/* PASO 0: CLIENTE */}
      {step===0 && <div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>Tipo de cliente</div>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <button style={S.tb(tipo==="soy_leader")} onClick={()=>{st("soy_leader");sf(null)}}>SOY LEADER</button>
          <button style={S.tb(tipo==="cliente_base")} onClick={()=>{st("cliente_base");sf(null)}}>Cliente Base</button>
        </div>

        <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>¿A quién visitás?</div>
        {farmer
          ? <div style={{background:"#fff",borderRadius:12,padding:14,display:"flex",alignItems:"center",justifyContent:"space-between",border:"1px solid #00A651",marginBottom:8}}>
              <div>
                <div style={{fontSize:15,fontWeight:600}}>{farmer.n}</div>
                <div style={{fontSize:12,color:"#555",marginTop:2}}>{farmer.e} · {farmer.h} ha</div>
              </div>
              <button onClick={()=>sf(null)} style={{background:"none",border:"none",color:"#00A651",fontWeight:600,cursor:"pointer",fontSize:14}}>Cambiar</button>
            </div>
          : <>
              <input style={S.inp} placeholder="Buscar productor..." value={search} onChange={e=>sq(e.target.value)}/>
              {ff.map(f=>
                <div key={f.id} style={{background:"#fff",borderRadius:10,padding:14,marginBottom:8,boxShadow:"0 1px 3px rgba(0,0,0,.04)",cursor:"pointer"}} onClick={()=>sf(f)}>
                  <div style={{fontSize:15,fontWeight:600}}>{f.n}
                    <span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:6,marginLeft:8,background:"#E8F5E9",color:"#00A651"}}>SOY LEADER</span>
                  </div>
                  <div style={{fontSize:12,color:"#555",marginTop:3}}>{f.e} · {f.d} · {f.h} ha</div>
                  <div style={{display:"flex",gap:4,marginTop:6}}>
                    {f.cu.map(c=><span key={c} style={{fontSize:10,background:"#f0f0f0",padding:"2px 8px",borderRadius:10,color:"#666"}}>{c}</span>)}
                  </div>
                </div>
              )}
            </>
        }
      </div>}

      {/* PASO 1: CULTIVO + CAMPAÑA */}
      {step===1 && <div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>Cultivo</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
          {["Soja","Trigo","Maíz","Canola"].map(c=><button key={c} style={S.ch(cult===c)} onClick={()=>sc(c)}>{c}</button>)}
        </div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>Campaña</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
          {["2024/2025","2025/2026","2026/2027"].map(c=><button key={c} style={S.ch(camp===c)} onClick={()=>sm(c)}>{c}</button>)}
        </div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>Fecha</div>
        <div style={{background:"#fff",borderRadius:10,padding:14,border:"1px solid #e0e0e0"}}>
          <div style={{fontSize:16,fontWeight:600}}>{dt}</div>
          <div style={{fontSize:12,color:"#999",marginTop:2}}>Asignada automáticamente</div>
        </div>
      </div>}

      {/* PASO 2: POSICIONAMIENTO */}
      {step===2 && <div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>Posicionamiento</div>
        <div style={{fontSize:12,color:"#999",marginBottom:14}}>Productos Syngenta que fuiste a posicionar en esta visita.</div>
        <input style={S.inp} placeholder="Buscar producto..." value={psq} onChange={e=>sps(e.target.value)}/>
        <div style={{maxHeight:320,overflowY:"auto"}}>
          {allP.filter(p=>p.toLowerCase().includes(psq.toLowerCase())).slice(0,15).map(p=>{
            const sel=pos.includes(p);
            return <div key={p} onClick={()=>sp(prev=>sel?prev.filter(x=>x!==p):[...prev,p])}
              style={{...S.lb,marginBottom:6,...(sel?{borderColor:"#00A651",background:"#E8F5E9"}:{})}}>
              <span style={{fontSize:14,fontWeight:600}}>{p}</span>
              {sel && <span style={{color:"#00A651",fontWeight:700}}>✓</span>}
            </div>
          })}
        </div>
        {pos.length>0 && <div style={{marginTop:10,fontSize:12,color:"#00A651",fontWeight:600}}>
          {pos.length} seleccionado{pos.length>1?"s":""}: {pos.join(", ")}
        </div>}
      </div>}

      {/* PASO 3: CIERRES */}
      {step===3 && <div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>Cierres de Negocios</div>
        <div style={{fontSize:12,color:"#999",marginBottom:14}}>¿El productor cerró compra en alguna línea?</div>
        {["SC","HERB","INS"].map(l=>
          <div key={l} style={{marginBottom:10}}>
            <div style={S.lb} onClick={()=>sci(p=>({...p,[l]:{...p[l],on:!p[l].on}}))}>
              <span style={{fontSize:15,fontWeight:600}}>{l==="HERB"?"Herbicidas":l==="INS"?"Insecticidas":"Semilleros"}</span>
              <span style={S.bg(ci[l].on)}>{ci[l].on?"Cerrado ✓":"No"}</span>
            </div>
            {ci[l].on && <div style={{background:"#fff",padding:14,border:"1px solid #e0e0e0",borderTop:"none",borderRadius:"0 0 12px 12px"}}>
              <div style={{display:"flex",gap:8,marginBottom:12}}>
                <button style={S.tb(!ci[l].c)} onClick={()=>sci(p=>({...p,[l]:{...p[l],c:false}}))}>Syngenta</button>
                <button style={S.tb(ci[l].c)} onClick={()=>sci(p=>({...p,[l]:{...p[l],c:true}}))}>Competencia</button>
              </div>
              {!ci[l].c
                ? <select style={S.inp} value={ci[l].p} onChange={e=>sci(p=>({...p,[l]:{...p[l],p:e.target.value}}))}>
                    <option value="">Seleccionar producto...</option>
                    {(l==="SC"?P.SC:l==="HERB"?P.HERB:l==="INS"?P.INS:P.FUN).map(p=><option key={p}>{p}</option>)}
                  </select>
                : <input style={S.inp} placeholder="Nombre producto competencia..." value={ci[l].p} onChange={e=>sci(p=>({...p,[l]:{...p[l],p:e.target.value}}))}/>
              }
            </div>}
          </div>
        )}
      </div>}

      {/* PASO 4: APLICACIONES */}
      {step===4 && <div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>Aplicaciones</div>
        {[["VEG","Aplic. Vegetativa (INS)"],["FUN1","Fungicida 1"],["FUN2","Fungicida 2"],["FUN3","Fungicida 3"]].map(([k,l])=>
          <div key={k} style={{marginBottom:10}}>
            <div style={S.lb} onClick={()=>sa(p=>({...p,[k]:!p[k]}))}>
              <span style={{fontSize:15,fontWeight:600}}>{l}</span>
              <span style={S.bg(ap[k])}>{ap[k]?"Sí":"No"}</span>
            </div>
            {ap[k] && <div style={{background:"#fff",padding:14,border:"1px solid #e0e0e0",borderTop:"none",borderRadius:"0 0 12px 12px"}}>
              <select style={S.inp}>
                <option>Seleccionar producto...</option>
                {(k==="VEG"?P.INS:P.FUN).map(p=><option key={p}>{p}</option>)}
              </select>
            </div>}
          </div>
        )}
        <div style={{...S.lb,marginTop:4}} onClick={()=>spl(!pl)}>
          <span style={{fontSize:15,fontWeight:600}}>¿Tiene plaga?</span>
          <span style={S.bg(pl)}>{pl?"Sí":"No"}</span>
        </div>
        {pl && <div style={{background:"#fff",padding:14,border:"1px solid #e0e0e0",borderTop:"none",borderRadius:"0 0 12px 12px"}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {["Roya","Mancha ojo de rana","Antracnosis","Trips","Chinche","Mosca blanca","Pulgón","Otro"].map(p=>
              <button key={p} style={S.ch(false)}>{p}</button>
            )}
          </div>
        </div>}
      </div>}

      {/* PASO 5: FENOLOGÍA */}
      {step===5 && <div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>Estadio fenológico</div>
        {[["% Desecación","d"],["% Siembra","s"],["% Cosecha","c"]].map(([l,k])=>
          <div key={k} style={{background:"#fff",borderRadius:12,padding:16,border:"1px solid #e0e0e0",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:12,color:"#999"}}>{l}</span>
              <span style={{fontSize:18,fontWeight:700,color:"#00A651"}}>{fe[k]}%</span>
            </div>
            <input type="range" min="0" max="100" step="10" value={fe[k]}
              onChange={e=>sfe(p=>({...p,[k]:+e.target.value}))}
              style={{width:"100%",accentColor:"#00A651"}}/>
          </div>
        )}
        <div style={{background:"#fff",borderRadius:12,padding:16,border:"1px solid #e0e0e0"}}>
          <div style={{fontSize:12,color:"#999",marginBottom:6}}>Promedio ton/ha</div>
          <input style={{...S.inp,marginBottom:0}} type="number" placeholder="0" value={fe.t}
            onChange={e=>sfe(p=>({...p,t:e.target.value}))}/>
        </div>
      </div>}

      {/* PASO 6: NOTAS + FOTOS */}
      {step===6 && <div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>Observaciones</div>
        <textarea style={{width:"100%",padding:12,borderRadius:10,border:"1px solid #e0e0e0",fontSize:14,minHeight:120,resize:"vertical",outline:"none",fontFamily:"inherit",boxSizing:"border-box"}}
          placeholder="Anotá cualquier observación relevante de la visita..."
          value={no} onChange={e=>sno(e.target.value)}/>

        <div style={{fontSize:15,fontWeight:700,marginTop:16,marginBottom:10}}>Fotos</div>
        <div style={{background:"#fff",borderRadius:12,border:"2px dashed #e0e0e0",padding:30,textAlign:"center",color:"#bbb",fontSize:14}}>
          📷 Tocar para agregar fotos<br/>
          <span style={{fontSize:11}}>(Demo: función deshabilitada)</span>
        </div>
      </div>}

      {/* Navegación */}
      <div style={{display:"flex",gap:10,marginTop:24}}>
        {step>0 && <button onClick={()=>ss(step-1)}
          style={{flex:1,borderRadius:12,padding:14,textAlign:"center",fontSize:14,fontWeight:600,cursor:"pointer",border:"1px solid #e0e0e0",background:"#fff",color:"#555"}}>← Anterior</button>}
        {step<6 && <button onClick={()=>cn()&&ss(step+1)}
          style={{flex:1,borderRadius:12,padding:14,textAlign:"center",fontSize:14,fontWeight:700,cursor:"pointer",border:"none",background:cn()?"#00A651":"#aaa",color:"#fff"}}>Siguiente →</button>}
        {step===6 && <button onClick={()=>sok(true)}
