<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demo - DTM Mobile | Syngenta Paraguay</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; overscroll-behavior: none; }
        #root { max-width: 430px; margin: 0 auto; min-height: 100vh; background: #f5f5f5; position: relative; }
        @media (min-width: 431px) { #root { border-left: 1px solid #e0e0e0; border-right: 1px solid #e0e0e0; box-shadow: 0 0 40px rgba(0,0,0,0.08); } body { background: #e8e8e8; } }
        input, select, textarea { font-family: inherit; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const MENU = [
  { label: "Nueva Visita", sub: "Registra una visita ahora", icon: "⚡", color: "#F59E0B", route: "new-visit" },
  { label: "Mis Visitas", sub: "Historial de visitas", icon: "📋", color: "#3B82F6", route: "visits" },
  { label: "Mis Productores", sub: "Farmers y datos cualitativos", icon: "👥", color: "#00A651", route: "farmers" },
  { label: "Charlas", sub: "Registro de capacitaciones", icon: "🎓", color: "#8B5CF6", route: "trainings" },
  { label: "Agenda", sub: "Visitas programadas", icon: "📅", color: "#EC4899", route: "agenda" },
  { label: "Monitoreos", sub: "Seguimiento de aplicaciones", icon: "🧪", color: "#06B6D4", route: "monitoreos" },
  { label: "EUPs", sub: "Ensayos comparativos en campo", icon: "🌱", color: "#10B981", route: "eup" },
];

const STEPS = ["Cliente", "Cultivo", "Posicionamiento", "Cierres", "Aplicaciones", "Fenología", "Notas"];
const FARMERS = [
  { id: "1", nombre: "Juan Benítez", establecimiento: "Estancia El Sol", es_soy_leader: true },
  { id: "2", nombre: "Roberto Schmalko", establecimiento: "Campo Norte", es_soy_leader: true },
  { id: "3", nombre: "Ana Villalba", establecimiento: "Finca Santa Ana", es_soy_leader: true },
  { id: "4", nombre: "Pedro Ramírez", establecimiento: "Agro Paraná", es_soy_leader: true },
  { id: "5", nombre: "María González", establecimiento: "La Esperanza", es_soy_leader: true },
];
const PRODUCTS = [
  { id: 1, nombre: "AMISTAR TOP", linea: "FUN" },
  { id: 2, nombre: "ELATUS", linea: "FUN" },
  { id: 3, nombre: "KARATE ZEON", linea: "INS" },
  { id: 4, nombre: "CRUISER", linea: "SC" },
  { id: 5, nombre: "FLEX", linea: "HERB" },
  { id: 6, nombre: "MIRAVIS DUO", linea: "FUN" },
  { id: 7, nombre: "FORTENZA DUO", linea: "SC" },
  { id: 8, nombre: "ORION", linea: "FUN" },
];

const s = {
  safe: { minHeight: "100vh", background: "#f5f5f5", paddingBottom: 40 },
  scroll: { padding: 20, paddingTop: 16 },
  header: { textAlign: "center", marginBottom: 28 },
  greeting: { fontSize: 24, fontWeight: 700, color: "#1a1a1a" },
  date: { fontSize: 13, color: "#888", marginTop: 4, textTransform: "capitalize" },
  card: { background: "#fff", borderRadius: 14, padding: 14, display: "flex", flexDirection: "row", alignItems: "center", marginBottom: 10, boxShadow: "0 1px 4px rgba(0,0,0,0.06)", cursor: "pointer", border: "none", width: "100%", textAlign: "left" },
  iconWrap: { width: 46, height: 46, borderRadius: 13, display: "flex", alignItems: "center", justifyContent: "center", marginRight: 14, fontSize: 22, flexShrink: 0 },
  cardText: { flex: 1 },
  cardLabel: { fontSize: 15, fontWeight: 700, color: "#1a1a1a" },
  cardSub: { fontSize: 12, color: "#888", marginTop: 2 },
  chevron: { color: "#ccc", fontSize: 16 },
  logoutBtn: { marginTop: 16, background: "#fff0f0", borderRadius: 14, padding: 16, display: "flex", flexDirection: "row", alignItems: "center", justifyContent: "center", border: "1px solid #ffcccc", cursor: "pointer", width: "100%" },
  logoutText: { fontSize: 14, fontWeight: 700, color: "#e53935" },
  // Visit wizard
  wizHeader: { background: "#00A651", paddingTop: 52, paddingBottom: 14, paddingLeft: 20, paddingRight: 20 },
  wizTitle: { fontSize: 20, fontWeight: 700, color: "#fff" },
  wizBack: { background: "none", border: "none", color: "rgba(255,255,255,0.85)", fontSize: 22, cursor: "pointer", marginBottom: 6, padding: 0 },
  stepsRow: { display: "flex", gap: 6, padding: "12px 16px", background: "#fff", overflowX: "auto", borderBottom: "1px solid #f0f0f0" },
  stepItem: { display: "flex", flexDirection: "column", alignItems: "center", minWidth: 52 },
  stepDot: { width: 26, height: 26, borderRadius: 13, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, marginBottom: 3 },
  stepLabel: { fontSize: 9, textAlign: "center" },
  content: { padding: 20 },
  sectionTitle: { fontSize: 15, fontWeight: 700, color: "#1a1a1a", marginBottom: 10, marginTop: 4 },
  sectionSub: { fontSize: 12, color: "#999", marginBottom: 14, marginTop: -6 },
  toggleRow: { display: "flex", gap: 8, marginBottom: 12 },
  toggleBtn: { flex: 1, padding: 10, borderRadius: 10, border: "1px solid #e0e0e0", textAlign: "center", background: "#fff", cursor: "pointer", fontSize: 13, fontWeight: 600, color: "#999" },
  toggleActive: { borderColor: "#00A651", background: "#E8F5E9", color: "#00A651" },
  input: { width: "100%", padding: "12px 14px", borderRadius: 10, border: "1px solid #e0e0e0", fontSize: 15, outline: "none", marginBottom: 10, background: "#fff", boxSizing: "border-box" },
  farmerCard: { background: "#fff", borderRadius: 10, padding: 14, marginBottom: 8, boxShadow: "0 1px 3px rgba(0,0,0,0.04)", cursor: "pointer" },
  selectedCard: { background: "#fff", borderRadius: 12, padding: 14, display: "flex", flexDirection: "row", alignItems: "center", justifyContent: "space-between", border: "1px solid #e0e0e0", marginBottom: 8 },
  chipRow: { display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 14 },
  chip: { padding: "8px 14px", borderRadius: 20, border: "1px solid #e0e0e0", background: "#fff", cursor: "pointer", fontSize: 13, color: "#555" },
  chipActive: { background: "#E8F5E9", borderColor: "#00A651", color: "#00A651", fontWeight: 600 },
  lineaBlock: { background: "#fff", borderRadius: 12, padding: 14, display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 2, border: "1px solid #e0e0e0", cursor: "pointer" },
  badge: { padding: "4px 12px", borderRadius: 20, fontSize: 12, fontWeight: 700, color: "#fff" },
  sliderBlock: { background: "#fff", borderRadius: 12, padding: 16, border: "1px solid #e0e0e0", marginBottom: 14 },
  sliderLabel: { display: "flex", justifyContent: "space-between", marginBottom: 6 },
  slider: { width: "100%", accentColor: "#00A651" },
  textarea: { width: "100%", padding: 12, borderRadius: 10, border: "1px solid #e0e0e0", fontSize: 14, minHeight: 120, resize: "vertical", outline: "none", fontFamily: "inherit", boxSizing: "border-box" },
  navRow: { display: "flex", gap: 10, marginTop: 24 },
  navBtn: { flex: 1, borderRadius: 12, padding: 14, textAlign: "center", fontSize: 15, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, border: "1px solid #e0e0e0", background: "#fff", color: "#555" },
  navBtnPrimary: { background: "#00A651", borderColor: "#00A651", color: "#fff", fontWeight: 700 },
  demo: { textAlign: "center", padding: 20, color: "#bbb", fontSize: 11 },
};

function getTodayLabel() {
  return new Date().toLocaleDateString("es-PY", { weekday: "long", day: "numeric", month: "long" });
}

function Home({ onNavigate }) {
  return (
    <div style={s.safe}>
      <div style={s.scroll}>
        <div style={s.header}>
          <div style={s.greeting}>Hola, Carlos 👋</div>
          <div style={s.date}>{getTodayLabel()}</div>
        </div>
        <div>
          {MENU.map(item => (
            <button key={item.route} style={s.card} onClick={() => onNavigate(item.route)}>
              <div style={{ ...s.iconWrap, background: item.color + "18" }}>{item.icon}</div>
              <div style={s.cardText}>
                <div style={s.cardLabel}>{item.label}</div>
                <div style={s.cardSub}>{item.sub}</div>
              </div>
              <span style={s.chevron}>›</span>
            </button>
          ))}
        </div>
        <button style={s.logoutBtn}>
          <span style={{ marginRight: 8 }}>🚪</span>
          <span style={s.logoutText}>Cerrar sesión</span>
        </button>
        <div style={s.demo}>Demo con datos ficticios — Syngenta Paraguay</div>
      </div>
    </div>
  );
}

function VisitWizard({ onBack }) {
  const [step, setStep] = useState(0);
  const [tipoVisita, setTipoVisita] = useState("soy_leader");
  const [selectedFarmer, setSelectedFarmer] = useState(null);
  const [search, setSearch] = useState("");
  const [cultivo, setCultivo] = useState("");
  const [campana, setCampana] = useState("2025/2026");
  const [posicionamiento, setPosicionamiento] = useState([]);
  const [cierres, setCierres] = useState({ SC: { cerrado: false, comp: false }, HERB: { cerrado: false, comp: false }, INS: { cerrado: false, comp: false } });
  const [aplicaciones, setAplic] = useState({ VEG: false, FUN1: false, FUN2: false, FUN3: false });
  const [plaga, setPlaga] = useState(false);
  const [fen, setFen] = useState({ desecacion: 0, siembra: 60, cosecha: 0, ton: "" });
  const [notas, setNotas] = useState("");
  const [saved, setSaved] = useState(false);

  const filtered = FARMERS.filter(f => f.nombre.toLowerCase().includes(search.toLowerCase()));
  const fecha = new Date().toISOString().split("T")[0];

  const canNext = () => {
    if (step === 0) return !!selectedFarmer;
    if (step === 1) return !!cultivo;
    return true;
  };

  if (saved) {
    return (
      <div style={{ ...s.safe, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", padding: 40, textAlign: "center" }}>
        <div style={{ fontSize: 60, marginBottom: 20 }}>✅</div>
        <div style={{ fontSize: 20, fontWeight: 700, color: "#1a1a1a", marginBottom: 8 }}>Visita registrada</div>
        <div style={{ fontSize: 14, color: "#888", marginBottom: 24 }}>Visita a {selectedFarmer?.nombre} guardada exitosamente.</div>
        <button onClick={onBack} style={{ ...s.navBtn, ...s.navBtnPrimary, maxWidth: 200, border: "none" }}>Volver al inicio</button>
      </div>
    );
  }

  return (
    <div style={s.safe}>
      <div style={s.wizHeader}>
        <button style={s.wizBack} onClick={onBack}>←</button>
        <div style={s.wizTitle}>Nueva Visita ⚡</div>
      </div>

      <div style={s.stepsRow}>
        {STEPS.map((label, i) => (
          <div key={label} style={s.stepItem}>
            <div style={{ ...s.stepDot, background: i <= step ? "#00A651" : "#e0e0e0", color: i <= step ? "#fff" : "#999" }}>{i + 1}</div>
            <div style={{ ...s.stepLabel, color: i === step ? "#00A651" : "#999", fontWeight: i === step ? 600 : 400 }}>{label}</div>
          </div>
        ))}
      </div>

      <div style={s.content}>
        {/* Step 0: Cliente */}
        {step === 0 && (<div>
          <div style={s.sectionTitle}>Tipo de cliente</div>
          <div style={s.toggleRow}>
            <button style={{ ...s.toggleBtn, ...(tipoVisita === "soy_leader" ? s.toggleActive : {}) }} onClick={() => setTipoVisita("soy_leader")}>SOY LEADER</button>
            <button style={{ ...s.toggleBtn, ...(tipoVisita === "cliente_base" ? s.toggleActive : {}) }} onClick={() => setTipoVisita("cliente_base")}>Cliente Base</button>
          </div>
          <div style={s.sectionTitle}>¿A quién visitás?</div>
          {selectedFarmer ? (
            <div style={s.selectedCard}>
              <div><div style={{ fontSize: 15, fontWeight: 600 }}>{selectedFarmer.nombre}</div><div style={{ fontSize: 12, color: "#555", marginTop: 2 }}>{selectedFarmer.establecimiento}</div></div>
              <button onClick={() => setSelectedFarmer(null)} style={{ background: "none", border: "none", color: "#00A651", fontWeight: 600, cursor: "pointer", fontSize: 14 }}>Cambiar</button>
            </div>
          ) : (<>
            <input style={s.input} placeholder="Buscar productor..." value={search} onChange={e => setSearch(e.target.value)} />
            {filtered.map(f => (
              <div key={f.id} style={s.farmerCard} onClick={() => setSelectedFarmer(f)}>
                <div style={{ fontSize: 15, fontWeight: 600, color: "#1a1a1a" }}>{f.nombre}</div>
                <div style={{ fontSize: 13, color: "#555", marginTop: 2 }}>{f.establecimiento} · SOY LEADER</div>
              </div>
            ))}
          </>)}
        </div>)}

        {/* Step 1: Cultivo */}
        {step === 1 && (<div>
          <div style={s.sectionTitle}>Cultivo</div>
          <div style={s.chipRow}>
            {["Soja", "Trigo", "Maíz", "Canola"].map(c => (
              <button key={c} style={{ ...s.chip, ...(cultivo === c ? s.chipActive : {}) }} onClick={() => setCultivo(c)}>{c}</button>
            ))}
          </div>
          <div style={s.sectionTitle}>Campaña</div>
          <div style={s.chipRow}>
            {["2024/2025", "2025/2026", "2026/2027"].map(c => (
              <button key={c} style={{ ...s.chip, ...(campana === c ? s.chipActive : {}) }} onClick={() => setCampana(c)}>{c}</button>
            ))}
          </div>
          <div style={s.sectionTitle}>Fecha</div>
          <div style={{ background: "#fff", borderRadius: 10, padding: 14, border: "1px solid #e0e0e0" }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>{fecha}</div>
            <div style={{ fontSize: 12, color: "#999", marginTop: 2 }}>Asignada automáticamente</div>
          </div>
        </div>)}

        {/* Step 2: Posicionamiento */}
        {step === 2 && (<div>
          <div style={s.sectionTitle}>Posicionamiento</div>
          <div style={s.sectionSub}>Seleccioná los productos que fuiste a posicionar hoy.</div>
          {PRODUCTS.map(p => {
            const sel = posicionamiento.includes(p.id);
            return (
              <div key={p.id} style={{ ...s.lineaBlock, marginBottom: 6, ...(sel ? { borderColor: "#00A651", background: "#E8F5E9" } : {}) }} onClick={() => setPosicionamiento(prev => sel ? prev.filter(x => x !== p.id) : [...prev, p.id])}>
                <div><div style={{ fontSize: 14, fontWeight: 600 }}>{p.nombre}</div><div style={{ fontSize: 11, color: "#aaa" }}>{p.linea}</div></div>
                {sel && <span style={{ color: "#00A651", fontWeight: 700 }}>✓</span>}
              </div>
            );
          })}
        </div>)}

        {/* Step 3: Cierres */}
        {step === 3 && (<div>
          <div style={s.sectionTitle}>Cierres de Negocios</div>
          <div style={s.sectionSub}>¿El productor cerró compra en alguna línea esta campaña?</div>
          {["SC", "HERB", "INS"].map(linea => (
            <div key={linea} style={{ marginBottom: 10 }}>
              <div style={s.lineaBlock} onClick={() => setCierres(p => ({ ...p, [linea]: { ...p[linea], cerrado: !p[linea].cerrado } }))}>
                <span style={{ fontSize: 15, fontWeight: 600 }}>{linea}</span>
                <span style={{ ...s.badge, background: cierres[linea].cerrado ? "#00A651" : "#e0e0e0" }}>{cierres[linea].cerrado ? "Cerrado ✓" : "No"}</span>
              </div>
              {cierres[linea].cerrado && (
                <div style={{ background: "#fff", padding: 14, border: "1px solid #e0e0e0", borderTop: "none", borderRadius: "0 0 12px 12px" }}>
                  <div style={s.toggleRow}>
                    <button style={{ ...s.toggleBtn, ...(!cierres[linea].comp ? s.toggleActive : {}) }} onClick={() => setCierres(p => ({ ...p, [linea]: { ...p[linea], comp: false } }))}>Syngenta</button>
                    <button style={{ ...s.toggleBtn, ...(cierres[linea].comp ? s.toggleActive : {}) }} onClick={() => setCierres(p => ({ ...p, [linea]: { ...p[linea], comp: true } }))}>Competencia</button>
                  </div>
                  <input style={s.input} placeholder={cierres[linea].comp ? "Nombre producto competencia..." : "Seleccionar producto Syngenta..."} />
                </div>
              )}
            </div>
          ))}
        </div>)}

        {/* Step 4: Aplicaciones */}
        {step === 4 && (<div>
          <div style={s.sectionTitle}>Aplicaciones</div>
          {[["VEG", "Aplic. Vegetativa"], ["FUN1", "Fungicida 1"], ["FUN2", "Fungicida 2"], ["FUN3", "Fungicida 3"]].map(([key, label]) => (
            <div key={key} style={{ marginBottom: 10 }}>
              <div style={s.lineaBlock} onClick={() => setAplic(p => ({ ...p, [key]: !p[key] }))}>
                <span style={{ fontSize: 15, fontWeight: 600 }}>{label}</span>
                <span style={{ ...s.badge, background: aplicaciones[key] ? "#00A651" : "#e0e0e0" }}>{aplicaciones[key] ? "Sí" : "No"}</span>
              </div>
              {aplicaciones[key] && (
                <div style={{ background: "#fff", padding: 14, border: "1px solid #e0e0e0", borderTop: "none", borderRadius: "0 0 12px 12px" }}>
                  <div style={s.toggleRow}>
                    <button style={{ ...s.toggleBtn, ...s.toggleActive }}>Syngenta</button>
                    <button style={s.toggleBtn}>Competencia</button>
                  </div>
                  <input style={s.input} placeholder="Seleccionar producto..." />
                </div>
              )}
            </div>
          ))}
          <div style={{ ...s.lineaBlock, marginTop: 4 }} onClick={() => setPlaga(!plaga)}>
            <span style={{ fontSize: 15, fontWeight: 600 }}>¿Tiene plaga?</span>
            <span style={{ ...s.badge, background: plaga ? "#00A651" : "#e0e0e0" }}>{plaga ? "Sí" : "No"}</span>
          </div>
          {plaga && (
            <div style={{ background: "#fff", padding: 14, border: "1px solid #e0e0e0", borderTop: "none", borderRadius: "0 0 12px 12px" }}>
              <div style={s.chipRow}>
                {["Roya", "Mancha ojo de rana", "Trips", "Chinche", "Otro"].map(p => (
                  <button key={p} style={s.chip}>{p}</button>
                ))}
              </div>
            </div>
          )}
        </div>)}

        {/* Step 5: Fenología */}
        {step === 5 && (<div>
          <div style={s.sectionTitle}>Estadio fenológico</div>
          {[["% Desecación", "desecacion"], ["% Siembra", "siembra"], ["% Cosecha", "cosecha"]].map(([label, key]) => (
            <div key={key} style={s.sliderBlock}>
              <div style={s.sliderLabel}>
                <span style={{ fontSize: 12, color: "#999" }}>{label}</span>
                <span style={{ fontSize: 18, fontWeight: 700, color: "#00A651" }}>{fen[key]}%</span>
              </div>
              <input type="range" min="0" max="100" step="10" value={fen[key]} onChange={e => setFen(p => ({ ...p, [key]: Number(e.target.value) }))} style={s.slider} />
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontSize: 10, color: "#ccc" }}>0%</span>
                <span style={{ fontSize: 10, color: "#ccc" }}>50%</span>
                <span style={{ fontSize: 10, color: "#ccc" }}>100%</span>
              </div>
            </div>
          ))}
          <div style={s.sliderBlock}>
            <div style={{ fontSize: 12, color: "#999", marginBottom: 6 }}>Promedio ton/ha</div>
            <input style={{ ...s.input, marginBottom: 0 }} type="number" placeholder="0" value={fen.ton} onChange={e => setFen(p => ({ ...p, ton: e.target.value }))} />
          </div>
        </div>)}

        {/* Step 6: Notas */}
        {step === 6 && (<div>
          <div style={s.sectionTitle}>Observaciones</div>
          <textarea style={s.textarea} placeholder="Anotá cualquier observación relevante..." value={notas} onChange={e => setNotas(e.target.value)} />
          <div style={{ ...s.sectionTitle, marginTop: 16 }}>Fotos</div>
          <div style={{ background: "#fff", borderRadius: 12, border: "2px dashed #e0e0e0", padding: 30, textAlign: "center", color: "#bbb", fontSize: 14 }}>
            📷 Tocar para agregar fotos<br /><span style={{ fontSize: 11 }}>(Demo: función deshabilitada)</span>
          </div>
        </div>)}

        {/* Nav */}
        <div style={s.navRow}>
          {step > 0 && (
            <button style={s.navBtn} onClick={() => setStep(step - 1)}>← Anterior</button>
          )}
          {step < 6 && (
            <button style={{ ...s.navBtn, ...s.navBtnPrimary, ...(canNext() ? {} : { background: "#aaa", borderColor: "#aaa" }) }} onClick={() => canNext() && setStep(step + 1)} disabled={!canNext()}>
              Siguiente →
            </button>
          )}
          {step === 6 && (
            <button style={{ ...s.navBtn, ...s.navBtnPrimary, border: "none" }} onClick={() => setSaved(true)}>
              ✓ Guardar visita
            </button>
          )}
        </div>
      </div>
      <div style={s.demo}>Demo con datos ficticios — Syngenta Paraguay</div>
    </div>
  );
}

function GenericModule({ title, icon, onBack }) {
  const items = [
    { name: "Juan Benítez · Soja · 2025/2026", date: "15/05/2026", status: "Completada" },
    { name: "Roberto Schmalko · Soja · 2025/2026", date: "14/05/2026", status: "Completada" },
    { name: "Ana Villalba · Trigo · 2025/2026", date: "12/05/2026", status: "Completada" },
    { name: "María González · Soja · 2025/2026", date: "10/05/2026", status: "Pendiente sync" },
  ];
  return (
    <div style={s.safe}>
      <div style={s.wizHeader}>
        <button style={s.wizBack} onClick={onBack}>←</button>
        <div style={s.wizTitle}>{icon} {title}</div>
      </div>
      <div style={s.content}>
        {items.map((item, i) => (
          <div key={i} style={{ ...s.lineaBlock, marginBottom: 8, flexDirection: "column", alignItems: "stretch" }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: "#1a1a1a" }}>{item.name}</div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
              <span style={{ fontSize: 12, color: "#888" }}>{item.date}</span>
              <span style={{ fontSize: 11, fontWeight: 600, color: item.status === "Completada" ? "#00A651" : "#F59E0B" }}>{item.status}</span>
            </div>
          </div>
        ))}
      </div>
      <div style={s.demo}>Demo con datos ficticios — Syngenta Paraguay</div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("home");

  if (view === "home") return <Home onNavigate={setView} />;
  if (view === "new-visit") return <VisitWizard onBack={() => setView("home")} />;

  const moduleMap = {
    visits: ["Mis Visitas", "📋"],
    farmers: ["Mis Productores", "👥"],
    trainings: ["Charlas", "🎓"],
    agenda: ["Agenda", "📅"],
    monitoreos: ["Monitoreos", "🧪"],
    eup: ["EUPs", "🌱"],
  };
  const [title, icon] = moduleMap[view] || ["Módulo", "📦"];
  return <GenericModule title={title} icon={icon} onBack={() => setView("home")} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
