<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - App de Eventos | Syngenta Paraguay</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #root { min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // ── Dummy Data ──
        const DUMMY_USER = { nombre: "Carlos", apellido: "López", role: "admin" };
        const DUMMY_EVENTS = [
            { id: 1, name: "Día de Campo Itapúa", description: "Demostración de fungicidas AMISTAR TOP y ELATUS en parcelas de soja R5.", location: "Capitán Miranda, Itapúa", event_date: "2026-05-22T08:00:00", is_active: true, attendee_count: 47 },
            { id: 2, name: "Charla FUN Alto Paraná", description: "Charla técnica sobre manejo integrado de roya con fungicidas Syngenta.", location: "Santa Rita, Alto Paraná", event_date: "2026-05-28T09:00:00", is_active: true, attendee_count: 23 },
            { id: 3, name: "Demo HERB Caaguazú", description: "Experiencia de uso positivo con herbicidas en parcelas de maíz.", location: "Coronel Oviedo, Caaguazú", event_date: "2026-06-05T07:30:00", is_active: true, attendee_count: 31 },
            { id: 4, name: "Jornada SC San Pedro", description: "Presentación de tratamiento de semillas para la campaña 2026/27.", location: "San Estanislao, San Pedro", event_date: "2026-04-15T08:00:00", is_active: false, attendee_count: 18 },
        ];
        const DUMMY_ATTENDEES = [
            { id: 1, cedula: "3456789", nombre: "Juan", apellido: "Benítez", cargo: "productor", empresa: "", email: "jbenitez@gmail.com", departamento: "Itapúa", distrito: "Capitán Miranda", whatsapp: "+595981234567", hectareas: 350, checkin_at: "2026-05-22T08:15:00" },
            { id: 2, cedula: "4567890", nombre: "María", apellido: "González", cargo: "productor", empresa: "", email: "", departamento: "Itapúa", distrito: "Bella Vista", whatsapp: "+595972345678", hectareas: 520, checkin_at: "2026-05-22T08:22:00" },
            { id: 3, cedula: "5678901", nombre: "Pedro", apellido: "Ramírez", cargo: "consultor_tecnico", empresa: "AgroConsult PY", email: "pramirez@agroconsult.com", departamento: "Alto Paraná", distrito: "Santa Rita", whatsapp: "+595983456789", hectareas: 1200, checkin_at: "2026-05-22T08:30:00" },
            { id: 4, cedula: "6789012", nombre: "Ana", apellido: "Villalba", cargo: "productor", empresa: "", email: "avillalba@yahoo.com", departamento: "Itapúa", distrito: "Hohenau", whatsapp: "+595974567890", hectareas: 180, checkin_at: "2026-05-22T08:45:00" },
            { id: 5, cedula: "7890123", nombre: "Roberto", apellido: "Schmalko", cargo: "productor", empresa: "", email: "", departamento: "Itapúa", distrito: "Obligado", whatsapp: "+595985678901", hectareas: 780, checkin_at: "2026-05-22T09:02:00" },
            { id: 6, cedula: "8901234", nombre: "Claudia", apellido: "Martínez", cargo: "vendedor", empresa: "DS Agro Sur", email: "cmartinez@agrosur.com.py", departamento: "Itapúa", distrito: "Encarnación", whatsapp: "+595976789012", hectareas: 2500, checkin_at: "2026-05-22T09:10:00" },
            { id: 7, cedula: "9012345", nombre: "Diego", apellido: "Fernández", cargo: "productor", empresa: "", email: "", departamento: "Itapúa", distrito: "Capitán Meza", whatsapp: "+595987890123", hectareas: 420, checkin_at: "2026-05-22T09:18:00" },
        ];
        const DEPARTAMENTOS = {
            "Alto Paraná": ["Ciudad del Este", "Hernandarias", "Santa Rita", "Minga Guazú", "Naranjal"],
            "Itapúa": ["Encarnación", "Capitán Miranda", "Hohenau", "Bella Vista", "Obligado", "Capitán Meza"],
            "Caaguazú": ["Coronel Oviedo", "Caaguazú", "Repatriación"],
            "San Pedro": ["San Estanislao", "Santa Rosa del Aguaray"],
        };

        function formatDate(d) {
            return new Date(d).toLocaleDateString("es-PY", { year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
        }
        function formatShort(d) {
            return new Date(d).toLocaleString("es-PY", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
        }

        // ── Dashboard ──
        function Dashboard({ onViewEvent }) {
            return (
                <div style={{ background: "#f9fafb", minHeight: "100vh" }}>
                    <div style={{ background: "#15803d", color: "white", padding: "16px 20px" }}>
                        <div style={{ maxWidth: 960, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <div>
                                <div style={{ fontSize: 20, fontWeight: 700 }}>Syngenta Eventos</div>
                                <div style={{ fontSize: 13, color: "#bbf7d0" }}>Hola, {DUMMY_USER.nombre} {DUMMY_USER.apellido}</div>
                            </div>
                            <button style={{ background: "#166534", color: "white", border: "none", padding: "8px 16px", borderRadius: 8, fontSize: 13, cursor: "pointer" }}>Cerrar Sesión</button>
                        </div>
                    </div>
                    <div style={{ maxWidth: 960, margin: "0 auto", padding: "24px 20px" }}>
                        <div style={{ marginBottom: 24 }}>
                            <h2 style={{ fontSize: 22, fontWeight: 700, color: "#1f2937", marginBottom: 16 }}>Mis Eventos</h2>
                            <div style={{ display: "flex", gap: 10 }}>
                                <button style={{ background: "#16a34a", color: "white", border: "none", padding: "10px 20px", borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>+ Crear Evento</button>
                                <button style={{ background: "#2563eb", color: "white", border: "none", padding: "10px 20px", borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Administrar Usuarios</button>
                            </div>
                        </div>
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(270px, 1fr))", gap: 20 }}>
                            {DUMMY_EVENTS.map(ev => (
                                <div key={ev.id} onClick={() => onViewEvent(ev.id)} style={{ background: "white", borderRadius: 12, boxShadow: "0 1px 8px rgba(0,0,0,0.08)", cursor: "pointer", overflow: "hidden" }}>
                                    <div style={{ padding: 20 }}>
                                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                                            <span style={{ background: ev.is_active ? "#dcfce7" : "#f3f4f6", color: ev.is_active ? "#166534" : "#6b7280", padding: "3px 10px", borderRadius: 20, fontSize: 11, fontWeight: 600 }}>{ev.is_active ? "Activo" : "Inactivo"}</span>
                                            <span style={{ color: "#9ca3af", fontSize: 12 }}>ID: {ev.id}</span>
                                        </div>
                                        <div style={{ fontSize: 16, fontWeight: 700, color: "#1f2937", marginBottom: 8 }}>{ev.name}</div>
                                        <div style={{ fontSize: 13, color: "#6b7280", marginBottom: 14, overflow: "hidden", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical" }}>{ev.description}</div>
                                        <div style={{ fontSize: 13, color: "#6b7280", display: "flex", flexDirection: "column", gap: 6 }}>
                                            <div>📅 {formatDate(ev.event_date)}</div>
                                            <div>📍 {ev.location}</div>
                                            <div>👥 {ev.attendee_count} asistentes</div>
                                        </div>
                                    </div>
                                    <div style={{ padding: "0 20px 20px" }}>
                                        <button style={{ width: "100%", background: "#16a34a", color: "white", border: "none", padding: "10px", borderRadius: 8, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>Ver Detalles</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div style={{ textAlign: "center", padding: "20px", color: "#9ca3af", fontSize: 12 }}>
                        Demo con datos ficticios — Syngenta Paraguay — Ecosistema Digital 2026
                    </div>
                </div>
            );
        }

        // ── Event Detail ──
        function EventDetail({ eventId, onBack, onViewCheckin }) {
            const ev = DUMMY_EVENTS.find(e => e.id === eventId) || DUMMY_EVENTS[0];
            const totalHa = DUMMY_ATTENDEES.reduce((s, a) => s + a.hectareas, 0);
            const avgHa = Math.round(totalHa / DUMMY_ATTENDEES.length);

            return (
                <div style={{ background: "#f9fafb", minHeight: "100vh" }}>
                    <div style={{ background: "#15803d", color: "white", padding: "16px 20px" }}>
                        <div style={{ maxWidth: 960, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <button onClick={onBack} style={{ background: "none", border: "none", color: "white", fontSize: 18, fontWeight: 700, cursor: "pointer" }}>← Syngenta Eventos</button>
                            <button style={{ background: "#166534", color: "white", border: "none", padding: "8px 16px", borderRadius: 8, fontSize: 13, cursor: "pointer" }}>Cerrar Sesión</button>
                        </div>
                    </div>
                    <div style={{ maxWidth: 960, margin: "0 auto", padding: "24px 20px" }}>
                        {/* Header */}
                        <div style={{ background: "white", borderRadius: 12, boxShadow: "0 1px 8px rgba(0,0,0,0.08)", padding: 24, marginBottom: 20 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
                                <div>
                                    <h1 style={{ fontSize: 22, fontWeight: 700, color: "#1f2937", marginBottom: 8 }}>{ev.name}</h1>
                                    <div style={{ fontSize: 14, color: "#6b7280" }}><strong>Ubicación:</strong> {ev.location}</div>
                                    <div style={{ fontSize: 14, color: "#6b7280" }}><strong>Fecha:</strong> {formatDate(ev.event_date)}</div>
                                </div>
                                <div style={{ display: "flex", gap: 8 }}>
                                    <button style={{ background: "#16a34a", color: "white", border: "none", padding: "10px 18px", borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>📥 Descargar Excel</button>
                                    <button style={{ background: "#9333ea", color: "white", border: "none", padding: "10px 18px", borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>🎲 Realizar Sorteo</button>
                                </div>
                            </div>
                        </div>

                        {/* Stats */}
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16, marginBottom: 20 }}>
                            {[{ l: "Total Asistentes", v: DUMMY_ATTENDEES.length, c: "#16a34a" }, { l: "Total Hectáreas", v: totalHa.toLocaleString(), c: "#2563eb" }, { l: "Promedio Hectáreas", v: avgHa, c: "#9333ea" }].map((s, i) => (
                                <div key={i} style={{ background: "white", borderRadius: 12, boxShadow: "0 1px 8px rgba(0,0,0,0.08)", padding: 20 }}>
                                    <div style={{ fontSize: 13, color: "#6b7280", fontWeight: 600 }}>{s.l}</div>
                                    <div style={{ fontSize: 28, fontWeight: 700, color: s.c }}>{s.v}</div>
                                </div>
                            ))}
                        </div>

                        {/* QR */}
                        <div style={{ background: "white", borderRadius: 12, boxShadow: "0 1px 8px rgba(0,0,0,0.08)", padding: 24, marginBottom: 20 }}>
                            <div style={{ fontSize: 17, fontWeight: 700, color: "#1f2937", marginBottom: 16 }}>📱 Código QR para Check-in</div>
                            <div style={{ display: "flex", gap: 24, alignItems: "center", flexWrap: "wrap" }}>
                                <div style={{ width: 160, height: 160, border: "3px solid #16a34a", borderRadius: 10, background: "#f0fdf4", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                                    <div style={{ textAlign: "center" }}>
                                        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, margin: "0 auto", width: 112 }}>
                                            {Array.from({ length: 49 }).map((_, i) => (
                                                <div key={i} style={{ width: 14, height: 14, borderRadius: 2, background: [0,1,2,3,4,5,6,7,8,12,14,18,20,24,25,26,28,30,34,36,40,42,43,44,45,46,47,48].includes(i) ? "#15803d" : "#dcfce7" }} />
                                            ))}
                                        </div>
                                        <div style={{ fontSize: 10, color: "#9ca3af", marginTop: 8 }}>QR Demo</div>
                                    </div>
                                </div>
                                <div style={{ flex: 1, minWidth: 200 }}>
                                    <div style={{ fontSize: 13, fontWeight: 600, color: "#374151", marginBottom: 6 }}>Enlace directo de check-in:</div>
                                    <div style={{ display: "flex", gap: 8 }}>
                                        <input readOnly value={`https://eventos.syngenta.com.py/checkin/${ev.id}?token=abc123`} style={{ flex: 1, padding: "10px 14px", border: "2px solid #d1d5db", borderRadius: 8, background: "#f9fafb", fontSize: 12, fontFamily: "monospace" }} />
                                        <button style={{ background: "#16a34a", color: "white", border: "none", padding: "10px 20px", borderRadius: 8, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>Copiar</button>
                                    </div>
                                    <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 6 }}>💡 Compartí este enlace por WhatsApp, email o redes sociales</div>
                                    <button onClick={onViewCheckin} style={{ marginTop: 10, fontSize: 13, fontWeight: 600, color: "#16a34a", background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>👁 Ver formulario de check-in (como lo ve el productor)</button>
                                </div>
                            </div>
                        </div>

                        {/* Table */}
                        <div style={{ background: "white", borderRadius: 12, boxShadow: "0 1px 8px rgba(0,0,0,0.08)", overflow: "hidden" }}>
                            <div style={{ padding: "16px 24px", borderBottom: "1px solid #e5e7eb" }}>
                                <div style={{ fontSize: 17, fontWeight: 700, color: "#1f2937" }}>Lista de Asistentes</div>
                            </div>
                            <div style={{ overflowX: "auto" }}>
                                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                                    <thead>
                                        <tr style={{ background: "#f9fafb" }}>
                                            {["Cédula", "Nombre", "Cargo", "Empresa", "Depto.", "WhatsApp", "Ha", "Check-in"].map(h => (
                                                <th key={h} style={{ padding: "10px 14px", textAlign: "left", fontSize: 11, fontWeight: 600, color: "#6b7280", textTransform: "uppercase", letterSpacing: 0.5 }}>{h}</th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {DUMMY_ATTENDEES.map(a => (
                                            <tr key={a.id} style={{ borderBottom: "1px solid #f3f4f6" }}>
                                                <td style={{ padding: "10px 14px", fontWeight: 500 }}>{a.cedula}</td>
                                                <td style={{ padding: "10px 14px" }}>{a.nombre} {a.apellido}</td>
                                                <td style={{ padding: "10px 14px", color: "#6b7280" }}>{a.cargo}</td>
                                                <td style={{ padding: "10px 14px", color: "#6b7280" }}>{a.empresa || "-"}</td>
                                                <td style={{ padding: "10px 14px", color: "#6b7280" }}>{a.departamento}</td>
                                                <td style={{ padding: "10px 14px", color: "#6b7280" }}>{a.whatsapp}</td>
                                                <td style={{ padding: "10px 14px", fontWeight: 600 }}>{a.hectareas}</td>
                                                <td style={{ padding: "10px 14px", color: "#6b7280", fontSize: 12 }}>{formatShort(a.checkin_at)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ── Checkin (what the producer sees) ──
        function CheckinView({ eventId, onBack }) {
            const ev = DUMMY_EVENTS.find(e => e.id === eventId) || DUMMY_EVENTS[0];
            const [formData, setFormData] = useState({ cedula: "", nombre: "", apellido: "", cargo: "", empresa: "", email: "", departamento: "", distrito: "", whatsapp: "", hectareas: "" });
            const [distritos, setDistritos] = useState([]);
            const [success, setSuccess] = useState(false);
            const [recognized, setRecognized] = useState(false);

            const handleCedulaChange = (val) => {
                setFormData(p => ({ ...p, cedula: val }));
                if (val === "3456789") {
                    setTimeout(() => {
                        setFormData({ cedula: "3456789", nombre: "Juan", apellido: "Benítez", cargo: "productor", empresa: "", departamento: "Itapúa", distrito: "Capitán Miranda", whatsapp: "981234567", hectareas: "350", email: "jbenitez@gmail.com" });
                        setDistritos(DEPARTAMENTOS["Itapúa"] || []);
                        setRecognized(true);
                        setTimeout(() => setRecognized(false), 4000);
                    }, 600);
                }
            };

            const handleDeptChange = (dept) => {
                setFormData(p => ({ ...p, departamento: dept, distrito: "" }));
                setDistritos(DEPARTAMENTOS[dept] || []);
            };

            const inp = { width: "100%", padding: "10px 12px", border: "1px solid #d1d5db", borderRadius: 8, fontSize: 14, outline: "none", boxSizing: "border-box" };
            const lbl = { display: "block", fontSize: 13, fontWeight: 700, color: "#374151", marginBottom: 4 };

            return (
                <div style={{ minHeight: "100vh", background: "linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%)" }}>
                    <div style={{ maxWidth: 420, margin: "0 auto", padding: "24px 16px" }}>
                        <div style={{ background: "white", borderRadius: 10, boxShadow: "0 2px 12px rgba(0,0,0,0.1)", padding: 24, marginBottom: 16, textAlign: "center" }}>
                            <div style={{ background: "#16a34a", color: "white", fontSize: 11, fontWeight: 700, padding: "4px 12px", borderRadius: 4, display: "inline-block", marginBottom: 12 }}>SYNGENTA</div>
                            <div style={{ color: "#16a34a", marginBottom: 8, fontSize: 28 }}>👥</div>
                            <div style={{ fontSize: 18, fontWeight: 700, color: "#1f2937" }}>{ev.name}</div>
                            <div style={{ fontSize: 14, color: "#6b7280", marginTop: 6, fontWeight: 600 }}>📍 {ev.location}</div>
                            <div style={{ fontSize: 13, color: "#9ca3af", marginTop: 4 }}>{formatDate(ev.event_date)}</div>
                        </div>

                        <button onClick={onBack} style={{ fontSize: 13, color: "#16a34a", background: "none", border: "none", cursor: "pointer", marginBottom: 12, fontWeight: 600 }}>← Volver al detalle</button>

                        <div style={{ background: "white", borderRadius: 10, boxShadow: "0 2px 12px rgba(0,0,0,0.1)", padding: 24 }}>
                            {success && (
                                <div style={{ marginBottom: 20, background: "#dcfce7", border: "1px solid #86efac", color: "#166534", padding: "12px 16px", borderRadius: 8 }}>
                                    <div style={{ fontWeight: 700 }}>✅ ¡Registro exitoso!</div>
                                    <div style={{ fontSize: 13 }}>Gracias por registrarte en el evento.</div>
                                </div>
                            )}
                            {recognized && (
                                <div style={{ marginBottom: 16, background: "#f0fdf4", borderLeft: "4px solid #4ade80", color: "#166534", padding: "12px 16px", borderRadius: 4 }}>
                                    <div style={{ fontWeight: 700 }}>¡Te reconocimos!</div>
                                    <div style={{ fontSize: 13 }}>Tus datos fueron recuperados. Verificá que estén correctos.</div>
                                </div>
                            )}
                            {!success && (
                                <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                                    <div>
                                        <label style={lbl}>Cédula <span style={{ color: "#ef4444" }}>*</span></label>
                                        <input style={inp} value={formData.cedula} onChange={e => handleCedulaChange(e.target.value)} placeholder='Probá escribir "3456789"' />
                                        <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 3 }}>Ingresá tu número de cédula</div>
                                    </div>
                                    <div>
                                        <label style={lbl}>Nombre <span style={{ color: "#ef4444" }}>*</span></label>
                                        <input style={{ ...inp, background: formData.nombre ? "#f3f4f6" : "white" }} value={formData.nombre} onChange={e => setFormData(p => ({ ...p, nombre: e.target.value }))} />
                                    </div>
                                    <div>
                                        <label style={lbl}>Apellido <span style={{ color: "#ef4444" }}>*</span></label>
                                        <input style={{ ...inp, background: formData.apellido ? "#f3f4f6" : "white" }} value={formData.apellido} onChange={e => setFormData(p => ({ ...p, apellido: e.target.value }))} />
                                    </div>
                                    <div>
                                        <label style={lbl}>Cargo <span style={{ color: "#ef4444" }}>*</span></label>
                                        <select style={{ ...inp, background: "white" }} value={formData.cargo} onChange={e => setFormData(p => ({ ...p, cargo: e.target.value }))}>
                                            <option value="">Seleccionar...</option>
                                            <option value="productor">Productor</option>
                                            <option value="consultor_tecnico">Consultor Técnico</option>
                                            <option value="vendedor">Vendedor</option>
                                            <option value="gerente">Gerente</option>
                                        </select>
                                    </div>
                                    {formData.cargo && formData.cargo !== "productor" && (
                                        <div>
                                            <label style={lbl}>Empresa <span style={{ color: "#ef4444" }}>*</span></label>
                                            <input style={inp} value={formData.empresa} onChange={e => setFormData(p => ({ ...p, empresa: e.target.value }))} />
                                        </div>
                                    )}
                                    <div>
                                        <label style={lbl}>Email <span style={{ color: "#9ca3af" }}>(opcional)</span></label>
                                        <input style={inp} value={formData.email} onChange={e => setFormData(p => ({ ...p, email: e.target.value }))} placeholder="tu@email.com" />
                                    </div>
                                    <div>
                                        <label style={lbl}>Departamento <span style={{ color: "#ef4444" }}>*</span></label>
                                        <select style={{ ...inp, background: "white" }} value={formData.departamento} onChange={e => handleDeptChange(e.target.value)}>
                                            <option value="">Seleccionar...</option>
                                            {Object.keys(DEPARTAMENTOS).map(d => <option key={d} value={d}>{d}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label style={lbl}>Distrito <span style={{ color: "#ef4444" }}>*</span></label>
                                        <select style={{ ...inp, background: "white", opacity: formData.departamento ? 1 : 0.5 }} value={formData.distrito} onChange={e => setFormData(p => ({ ...p, distrito: e.target.value }))} disabled={!formData.departamento}>
                                            <option value="">Seleccionar...</option>
                                            {distritos.map(d => <option key={d} value={d}>{d}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label style={lbl}>WhatsApp <span style={{ color: "#ef4444" }}>*</span></label>
                                        <div style={{ display: "flex" }}>
                                            <span style={{ display: "inline-flex", alignItems: "center", padding: "10px 12px", fontSize: 14, color: "#374151", background: "#f3f4f6", border: "1px solid #d1d5db", borderRight: "none", borderRadius: "8px 0 0 8px" }}>+595</span>
                                            <input style={{ ...inp, borderRadius: "0 8px 8px 0" }} value={formData.whatsapp} onChange={e => setFormData(p => ({ ...p, whatsapp: e.target.value }))} placeholder="981234567" />
                                        </div>
                                    </div>
                                    <div>
                                        <label style={lbl}>{formData.cargo === "productor" ? "Hectáreas" : "Hectáreas Atendidas"} <span style={{ color: "#ef4444" }}>*</span></label>
                                        <input style={inp} type="number" value={formData.hectareas} onChange={e => setFormData(p => ({ ...p, hectareas: e.target.value }))} placeholder="150" />
                                    </div>
                                    <button onClick={() => setSuccess(true)} style={{ width: "100%", background: "#16a34a", color: "white", border: "none", padding: "14px", borderRadius: 8, fontWeight: 700, fontSize: 14, cursor: "pointer", marginTop: 4 }}>Registrar Asistencia</button>
                                </div>
                            )}
                        </div>
                        <div style={{ textAlign: "center", padding: "20px", color: "#9ca3af", fontSize: 11 }}>
                            Demo con datos ficticios — Syngenta Paraguay
                        </div>
                    </div>
                </div>
            );
        }

        // ── Main App ──
        function App() {
            const [view, setView] = useState("dashboard");
            const [selectedEventId, setSelectedEventId] = useState(1);

            if (view === "dashboard") return <Dashboard onViewEvent={(id) => { setSelectedEventId(id); setView("detail"); }} />;
            if (view === "detail") return <EventDetail eventId={selectedEventId} onBack={() => setView("dashboard")} onViewCheckin={() => setView("checkin")} />;
            if (view === "checkin") return <CheckinView eventId={selectedEventId} onBack={() => setView("detail")} />;
            return null;
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
