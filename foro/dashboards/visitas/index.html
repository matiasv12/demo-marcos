:root{
  --bg:#F3F2F1; --canvas:#FFFFFF; --ink:#1F1F1F; --ink2:#5B5B5B; --muted:#8A8886; --line:#E1DFDD; --grid:#EDEBE9;
  --pri:#36398E; --pri2:#36398E; --priBg:#EBECF6;
  /* Syngenta: azul #36398E + verde #00A651 (logo) + tintes/sombras y grises */
  --c1:#36398E; --c2:#00A651; --c3:#5DBB85; --c4:#A3A5D6; --c5:#1E2060; --c6:#6B6B6B;
  --syn:#00A651; --comp:#e53935; --warn:#F59E0B; --good:#00A651; --bad:#e53935;
  --seq1:#E6E7F4; --seq5:#36398E;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "DIN","Barlow","Segoe UI",Arial,sans-serif}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .sub{opacity:.85;font-size:12px}
header .sp{flex:1}
.tag{font-size:12px;opacity:.75;border-left:1px solid rgba(255,255,255,.4);padding-left:12px}
.btn{background:#fff;color:var(--pri);border:0;border-radius:0;padding:6px 10px;font:inherit;font-weight:600;cursor:pointer}
.btn[aria-pressed=true]{background:#DDF3E6}
.upd{font-size:12px;opacity:.9}
.upd i{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:0;overflow:hidden}.seg button{border:0;background:#fff;padding:5px 12px;font:inherit;cursor:pointer;color:var(--ink2)}.seg button[aria-pressed=true]{background:var(--pri);color:#fff;font-weight:600}
.slicers{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--canvas);border-bottom:1px solid var(--line)}
.slicer{display:flex;flex-direction:column;gap:2px;min-width:120px}
.slicer label{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.slicer select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:0;background:#fff}
main{padding:12px 16px 80px;max-width:1400px;margin:0 auto}
.pagehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.pagehead h2{margin:0;font-size:20px;font-weight:600;color:var(--ink)}
.pagehead p{margin:0;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.card{background:var(--canvas);border:1px solid var(--line);border-radius:0;padding:10px 12px;min-width:0;position:relative}
.card h3{margin:0 0 6px;font-size:14px;font-weight:600}
.card .hint{font-size:11px;color:var(--muted);margin:-4px 0 6px}
.s2{grid-column:span 2}.s9{grid-column:span 9}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1000px){.s2,.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
@media (max-width:560px){.s2,.s3{grid-column:span 12}}
.kpi .v{font-size:30px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink2);font-size:12px}
.kpi .d{font-size:11px;margin-top:2px;color:var(--ink2)}
.up{color:#03703A} .down{color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:0;margin-right:4px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font:12px "DIN","Barlow",Arial,sans-serif;fill:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line);padding:5px 6px;white-space:nowrap}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.bar-cell{position:relative}
.bar-cell span.b{position:absolute;left:0;top:4px;bottom:4px;background:var(--seq1);border-radius:0;z-index:0}
.bar-cell b{position:relative;font-weight:400;z-index:1}
.pill{display:inline-block;font-variant-numeric:tabular-nums;font-weight:500}
.pill.ok{color:var(--ink)}.pill.warn{color:#B45309}.pill.bad{color:var(--comp);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:5}
.tabs button{border:0;background:none;padding:10px 14px;font:inherit;color:var(--ink2);cursor:pointer;white-space:nowrap;border-top:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--pri);font-weight:600;border-top-color:var(--pri);background:var(--priBg)}
.pbi{display:none;margin-top:8px;padding:8px;border-left:3px solid #F2C811;background:#FFFBEA;font-size:11px;color:#3B3B3B}
.pbi b{color:#000}
.pbi code{font:11px Consolas,monospace;white-space:pre-wrap;display:block;margin-top:4px;color:#1E3A8A}
body.showpbi .pbi{display:block}
#tip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.12);padding:6px 8px;border-radius:0;font-size:12px;display:none;z-index:20;max-width:260px}
.tilemap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tile{aspect-ratio:1.4;border-radius:0;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:10px;text-align:center;padding:2px;cursor:default}
.tile b{font-size:13px}
.note{font-size:11px;color:var(--muted)}
.model{font:12px Consolas,monospace;white-space:pre;overflow-x:auto;background:#FAFAFA;border:1px solid var(--line);padding:10px;border-radius:0}
ul.tight{margin:4px 0;padding-left:18px} ul.tight li{margin:2px 0}
</style>

const tip=document.getElementById("tip");
function bindTips(root){root.querySelectorAll("[data-tip]").forEach(el=>{
  el.addEventListener("mousemove",e=>{tip.innerHTML=el.dataset.tip;tip.style.display="block";
    const x=Math.min(e.clientX+12,innerWidth-270);tip.style.left=x+"px";tip.style.top=(e.clientY+12)+"px"});
  el.addEventListener("mouseleave",()=>tip.style.display="none")})}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const legend=items=>`<div class="legend">${items.map(([c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>`;
const pbi=(visual,dax)=>`<div class="pbi"><b>Visual:</b> ${visual}${dax?`<code>${esc(dax)}</code>`:""}</div>`;

function kpi(label,val,delta,up,visual,dax){return `<div class="card kpi s3"><div class="l">${label}</div><div class="v">${val}</div>
 ${delta?`<div class="d ${/^[+\-−]\d/.test(delta)?(up?"up":"down"):""}">${delta}</div>`:""}${pbi(visual||"Tarjeta (Card) nativa",dax)}</div>`}

// barras horizontales (una serie o apiladas)
function hbar(rows,series,{w=520,max,fmtv=fmt,pctMode=false}={}){
  const bh=18,gap=6,lw=150,H=rows.length*(bh+gap)+18;
  const mx=max||Math.max(...rows.map(r=>series.reduce((s,k)=>s+r[k.k],0)));
  let s=`<svg viewBox="0 0 ${w} ${H}" role="img">`;
  for(let t=0;t<=4;t++){const x=lw+(w-lw-40)*t/4;s+=`<line x1="${x}" x2="${x}" y1="0" y2="${H-16}" stroke="var(--grid)"/><text x="${x}" y="${H-3}" text-anchor="middle">${pctMode?(t*25)+"%":fmtv(Math.round(mx*t/4))}</text>`}
  rows.forEach((r,i)=>{const y=i*(bh+gap);let x=lw;
    s+=`<text x="${lw-6}" y="${y+bh/2+4}" text-anchor="end">${esc(r.label)}</text>`;
    const total=series.reduce((a,k)=>a+r[k.k],0);
    series.forEach((k,j)=>{const bw=Math.max(0,(w-lw-40)*r[k.k]/mx);if(bw<=0)return;
      const last=j===series.length-1;
      s+=`<rect x="${x}" y="${y}" width="${Math.max(0,bw-(last?0:2))}" height="${bh}" fill="${k.c}" data-tip="<b>${esc(r.label)}</b><br>${k.l}: ${pctMode?pct(r[k.k]):fmtv(r[k.k])}"/>`;x+=bw});
    if(!pctMode)s+=`<text x="${x+4}" y="${y+bh/2+4}" style="fill:var(--ink)">${fmtv(total)}</text>`;});
  return s+"</svg>"}

// columnas apiladas por semana
function stackCol(data,series,{w=640,h=220,labels=wk,line}={}){
  const pl=34,pb=20,pw=w-pl-8,ph=h-pb-8,n=data.length,cw=pw/n;
  const mx=Math.max(...data.map(d=>series.reduce((s,k)=>s+d[k.k],0)))*1.1;
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  for(let t=0;t<=4;t++){const y=8+ph-ph*t/4;s+=`<line x1="${pl}" x2="${w-8}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${pl-4}" y="${y+4}" text-anchor="end">${Math.round(mx*t/4)}</text>`}
  data.forEach((d,i)=>{let y=8+ph;const x=pl+i*cw+cw*.18,bw=cw*.64;
    const tipTxt=`<b>${labels[i]}</b><br>`+series.map(k=>`${k.l}: ${fmt(d[k.k])}`).join("<br>");
    series.forEach((k,j)=>{const bh=ph*d[k.k]/mx;if(bh<=0)return;y-=bh;
      s+=`<rect x="${x}" y="${y+(j?0:0)}" width="${bw}" height="${Math.max(0,bh-2)}" fill="${k.c}" data-tip="${esc(tipTxt)}"/>`});
    s+=`<text x="${x+bw/2}" y="${h-5}" text-anchor="middle">${labels[i]}</text>`});
  if(line){const pts=data.map((d,i)=>[pl+i*cw+cw/2,8+ph-ph*line.f(d)/mx]);
    s+=`<polyline fill="none" stroke="${line.c}" stroke-width="2" stroke-dasharray="4 3" points="${pts.map(p=>p.join(",")).join(" ")}"/>`}
  return s+"</svg>"}

// líneas
function lines(series,{w=640,h=220,labels=wk,max=100,suffix="%"}={}){
  const pl=34,pb=20,pw=w-pl-60,ph=h-pb-8,n=labels.length;
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  for(let t=0;t<=4;t++){const y=8+ph-ph*t/4;s+=`<line x1="${pl}" x2="${pl+pw}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${pl-4}" y="${y+4}" text-anchor="end">${Math.round(max*t/4)}${suffix}</text>`}
  labels.forEach((l,i)=>{s+=`<text x="${pl+pw*i/(n-1)}" y="${h-5}" text-anchor="middle">${l}</text>`});
  let lastY=[];series.forEach(se=>{const pts=se.v.map((v,i)=>[pl+pw*i/(n-1),8+ph-ph*v/max]);
    s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    pts.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="transparent" data-tip="<b>${labels[i]}</b><br>${se.l}: ${se.v[i]}${suffix}"/>`);
    const lp=pts[pts.length-1];let ly=lp[1]+4;lastY.forEach(y=>{if(Math.abs(ly-y)<12)ly=y+12});lastY.push(ly);s+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="${se.c}" stroke="#fff" stroke-width="2"/><text x="${lp[0]+8}" y="${ly}" style="fill:var(--ink)">${se.l}</text>`});
  return s+"</svg>"}

// tile map (en PBI: Shape map con TopoJSON de departamentos, o Azure Map con lat/lon)
function tileMap(vals,label){const mx=Math.max(...Object.values(vals));
  const cells=[];for(let r=0;r<5;r++)for(let c=0;c<5;c++)cells.push([c,r]);
  return `<div class="tilemap">${cells.map(([c,r])=>{const d=DEPTOS.find(x=>x[1]===c&&x[2]===r);if(!d)return `<div></div>`;
    const v=vals[d[0]],t=v/mx;const bg=`color-mix(in srgb, var(--seq5) ${Math.round(8+t*80)}%, #fff)`;
    return `<div class="tile" style="background:${bg};color:${t>.45?"#fff":"var(--ink)"}" data-tip="<b>${d[0]}</b><br>${label}: ${fmt(v)}"><span>${d[0]}</span><b>${fmt(v)}</b></div>`}).join("")}</div>`}

function heatTable(rows,cols,{fmtv=fmt}={}){
  const mx={};cols.forEach(c=>mx[c.k]=Math.max(...rows.map(r=>r[c.k])));
  return `<div class="scroll"><table class="tbl"><thead><tr><th>DTM</th>${cols.map(c=>`<th class="n">${c.l}</th>`).join("")}</tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.d)}</td>${cols.map(c=>{const v=r[c.k];const t=mx[c.k]?v/mx[c.k]:0;
    if(c.type==="bar")return `<td class="n bar-cell"><span class="b" style="width:${t*100}%"></span><b>${c.f?c.f(v):fmtv(v)}</b></td>`;
    if(c.type==="status"){const cls=c.cls?c.cls(v):v>=c.ok?"ok":v>=c.warn?"warn":"bad";return `<td class="n"><span class="pill ${cls}">${c.f(v)}</span></td>`}
    return `<td class="n" style="background:color-mix(in srgb, var(--seq5) ${Math.round(t*45)}%, #fff);color:${t>.75?"#fff":"inherit"}">${c.f?c.f(v):fmtv(v)}</td>`}).join("")}</tr>`).join("")}
  </tbody></table></div>`}

function scatter(pts,{w=560,h=300,xl="",yl="",meta}={}){const pl=46,pb=34,pw=w-pl-16,ph=h-pb-12;
 const mx=Math.max(...pts.map(p=>p.x))*1.15,my=1;let s=`<svg viewBox="0 0 ${w} ${h}">`;
 for(let t=0;t<=4;t++){const y=12+ph-ph*t/4;s+=`<line x1="${pl}" x2="${w-16}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${t*25}%</text>`;
  const x=pl+pw*t/4;s+=`<text x="${x}" y="${h-16}" text-anchor="middle">${Math.round(mx*t/4)}</text>`}
 if(meta){const y=12+ph-ph*meta;s+=`<line x1="${pl}" x2="${w-16}" y1="${y}" y2="${y}" stroke="#8A8886" stroke-dasharray="5 4"/><text x="${w-18}" y="${y-5}" text-anchor="end">Meta ${pct(meta)}</text>`}
 const ax=pl+pw*(pts.reduce((a,p)=>a+p.x,0)/pts.length)/mx;s+=`<line x1="${ax}" x2="${ax}" y1="12" y2="${12+ph}" stroke="#C8C6C4" stroke-dasharray="3 3"/>`;
 s+=`<text x="${pl+pw/2}" y="${h-1}" text-anchor="middle">${xl}</text>`;
 s+=`<text x="${pl+8}" y="24" style="fill:var(--muted)">Pocas visitas · alta conversión</text><text x="${w-20}" y="${12+ph-8}" text-anchor="end" style="fill:var(--comp)">Muchas visitas, baja conversión</text>`;
 pts.forEach(p=>{const x=pl+pw*p.x/mx,y=12+ph-ph*p.y/my,r=8+Math.sqrt(p.r)/22;
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--c1)" fill-opacity=".8" stroke="#fff" stroke-width="2" data-tip="<b>${p.l}</b><br>Visitas: ${p.x}<br>Conversión: ${pct(p.y)}<br>Vendido: ${usd(p.r)}"/>
  <text x="${x+r+4}" y="${y+4}" style="fill:var(--ink)">${p.l.split(" · ")[0]}</text>`});return s+"</svg>"}

function bullets(rows,{w=560}={}){const lw=150,bh=16,g=18,H=rows.length*(bh+g);const mx=Math.max(...rows.map(r=>Math.max(r.v,r.m)))*1.1;let s=`<svg viewBox="0 0 ${w} ${H}">`;
 rows.forEach((r,i)=>{const y=i*(bh+g)+4,sc=v=>lw+(w-lw-60)*v/mx;
  s+=`<text x="${lw-8}" y="${y+bh/2+4}" text-anchor="end">${r.l}</text><rect x="${lw}" y="${y-3}" width="${sc(r.m)-lw}" height="${bh+6}" fill="#EDEBE9"/>
  <rect x="${lw}" y="${y}" width="${sc(r.v)-lw}" height="${bh}" fill="${r.v>=r.m?"var(--syn)":"var(--c1)"}" data-tip="<b>${r.l}</b><br>Vendido: ${usd(r.v)}<br>Meta: ${usd(r.m)}"/>
  <line x1="${sc(r.m)}" x2="${sc(r.m)}" y1="${y-6}" y2="${y+bh+6}" stroke="#1F1F1F" stroke-width="2"/>
  <text x="${sc(Math.max(r.v,r.m))+6}" y="${y+bh/2+4}" style="fill:var(--ink)">${pct(r.v/r.m)}</text>`});return s+"</svg>"}

function snakeAgg(st){const w=1180,per=4,xs=[110,400,690,980],dy=170,y0=70;const pos=st.map((e,i)=>{const r=Math.floor(i/per),c=i%per;return [r%2?xs[per-1-c]:xs[c],y0+r*dy]});
 let d=`M${pos[0][0]} ${pos[0][1]}`;for(let i=1;i<pos.length;i++){const [x,y]=pos[i],[px,py]=pos[i-1];if(y===py)d+=` L${x} ${y}`;else{const cx=px+(px>600?1:-1)*80;d+=` C${cx} ${py} ${cx} ${y} ${x} ${y}`}}
 const H=y0+Math.ceil(st.length/per)*dy-40;let s=`<svg viewBox="0 0 ${w} ${H}"><path d="${d}" fill="none" stroke="#C8C6C4" stroke-width="8" stroke-linecap="butt"/>`;
 pos.forEach(([x,y],i)=>{const e=st[i],r=18+e.p*30,sel=i===4;
  if(sel)s+=`<circle cx="${x}" cy="${y}" r="${r+9}" fill="none" stroke="#36398E" stroke-width="2" stroke-dasharray="5 4"/>`;
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${e.c}" stroke="#fff" stroke-width="3" data-tip="<b>${e.l}</b><br>${pct(e.p)} de los SL · mediana día ${e.d}"/>
  <text x="${x}" y="${y+6}" text-anchor="middle" style="fill:#fff;font-size:16px;font-weight:700">${pct(e.p)}</text>
  <text x="${x}" y="${y+r+20}" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:600">${e.l}</text>
  <text x="${x}" y="${y+r+36}" text-anchor="middle" style="font-size:12px">día ${e.d} (mediana)${e.conv?" · "+e.conv:""}</text>`});
 return s+"</svg>"}

 s+=`<rect x="${sc(.7)}" y="0" width="${sc(1)-sc(.7)}" height="${H-24}" fill="#E3F6EC" opacity=".6"/><text x="${sc(.85)}" y="12" text-anchor="middle" style="fill:#03703A;font-weight:600">Fieles (≥70%)</text>`;
 s+=`<rect x="${sc(0)}" y="0" width="${sc(.3)-sc(0)}" height="${H-24}" fill="#FDE2E1" opacity=".5"/><text x="${sc(.15)}" y="12" text-anchor="middle" style="fill:#B42318;font-weight:600">En riesgo (&lt;30%)</text>`;
 rows.forEach((r,i)=>{const y=24+i*rh;s+=`<text x="${lw-10}" y="${y+4}" text-anchor="end" style="fill:var(--ink)">${r.l}</text>`;

  const m=r.v.reduce((a,p)=>a+p.v*p.ha,0)/r.v.reduce((a,p)=>a+p.ha,0);s+=`<line x1="${sc(m)}" x2="${sc(m)}" y1="${y-14}" y2="${y+14}" stroke="#1F1F1F" stroke-width="3"/>`});
 return s+"</svg>"}
function errBars(rows,{w=560,h=280}={}){const pl=120,pr=60,bh=22,g=16,H=rows.length*(bh+g)+28;const sc=v=>pl+(w-pl-pr)*v/100;let s=`<svg viewBox="0 0 ${w} ${H}">`;
 for(let t=0;t<=4;t++){const x=sc(t*25);s+=`<line x1="${x}" x2="${x}" y1="0" y2="${H-24}" stroke="var(--grid)"/><text x="${x}" y="${H-6}" text-anchor="middle">${t*25}%</text>`}
 rows.forEach((r,i)=>{const y=i*(bh+g)+10,ok=r.n>=15,c=ok?"var(--c1)":"#C8C6C4";

  s+=`<circle cx="${sc(r.m)}" cy="${y}" r="7" fill="${c}" stroke="#fff" stroke-width="2" data-tip="<b>${r.z}</b><br>${r.m}% ± ${r.e} (IC 95%)<br>n = ${r.n} productores · ${fmt(r.ha)} ha"/>`;
  s+=`<text x="${w-pr+6}" y="${y+4}" style="fill:${ok?"var(--ink2)":"var(--comp)"}">${ok?"n="+r.n:"n="+r.n+""}</text>`});

function funnel(st,{w=700}={}){const bh=46,g=10,H=st.length*(bh+g);const mx=st[0].v;let s=`<svg viewBox="0 0 ${w} ${H}">`;
 st.forEach((e,i)=>{const bw=(w-260)*e.v/mx,x=(w-260-bw)/2+20,y=i*(bh+g);
  s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${e.c}" data-tip="<b>${e.l}</b><br>${fmt(e.v)}"/>
  <text x="${x+bw/2}" y="${y+bh/2+6}" text-anchor="middle" style="fill:#fff;font-size:17px;font-weight:700">${e.f||fmt(e.v)}</text>
  <text x="${w-230}" y="${y+bh/2-2}" style="fill:var(--ink);font-size:13px;font-weight:600">${e.l}</text>

 let s=`<svg viewBox="0 0 ${W} ${H}"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#EDEBE9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#B3B0AD" stroke-width="2"/></pattern></defs><g transform="translate(${ox},10)">`;
 const side={noreste:[-1,-30],"san alberto":[1,0],este:[1,10],"sur este":[1,30],centro:[-1,0],sur:[-1,0]};
 rows.forEach(r=>{const z=by[r.z],ok=r.n>=15,fill=ok?seqCol(r.m):"url(#hatch)";
  s+=`<path d="${ZPATH[z.k]}" fill="${fill}" stroke="#fff" stroke-width=".6" data-tip="<b>${r.z}</b><br>${ok?r.m+"% ± "+r.e+" (IC 95%)":"Muestra chica: no concluir"}<br>n = ${r.n} productores · ${fmt(r.ha)} ha<br>Campaña anterior: ${r.prev}%"/>`});
 rows.forEach(r=>{const z=by[r.z],ok=r.n>=15,[cx,cy]=ZCEN[z.k],[sd,dy]=side[z.k];const tx=sd>0?MAPW-10:20,ty=cy+dy,lx=sd>0?tx+16:tx-16,anc=sd>0?"start":"end";
  s+=`<circle cx="${cx}" cy="${cy}" r="3" fill="#1F1F1F"/><polyline points="${cx},${cy} ${tx},${ty} ${lx-(sd>0?6:-6)},${ty}" fill="none" stroke="#1F1F1F" stroke-width="1"/>`;
  s+=`<text x="${lx}" y="${ty-6}" text-anchor="${anc}" style="fill:var(--ink);font-weight:600;font-size:12px">${r.z}</text>`;
  s+=`<text x="${lx}" y="${ty+13}" text-anchor="${anc}" style="fill:${ok?"var(--pri)":"#8A8886"};font-weight:700;font-size:18px">${ok?r.m+"%":"s/d"}</text>`;
  s+=`<text x="${lx}" y="${ty+28}" text-anchor="${anc}" style="font-size:10px;fill:${ok?"var(--ink2)":"var(--comp)"}">${ok?"± "+r.e+" · n="+r.n:"n="+r.n+" < 15"}</text>`});
 s+=`</g><g transform="translate(${W-190},${H-34})"><defs><linearGradient id="lg"><stop offset="0" stop-color="${seqCol(0)}"/><stop offset="1" stop-color="${seqCol(100)}"/></linearGradient></defs><rect width="150" height="10" fill="url(#lg)"/><text x="0" y="24">0%</text><text x="150" y="24" text-anchor="end">100%</text><text x="75" y="-4" text-anchor="middle">% de avance</text></g>`;
 return s+"</svg>"}

// ───────────── navegación ─────────────
const main=document.getElementById("main"),tabs=document.getElementById("tabs");
function show(id){const p=PAGES.find(x=>x.id===id)||PAGES[0];
  main.innerHTML=`<div class="pagehead"><h2>${p.t}</h2><p>${p.h}</p></div>`+p.render();
  [...tabs.children].forEach(b=>b.setAttribute("aria-selected",b.dataset.id===p.id));bindTips(main);
  try{localStorage.setItem("pbiTab",p.id)}catch(e){}}
PAGES.forEach(p=>{const b=document.createElement("button");b.textContent=p.t;b.dataset.id=p.id;b.setAttribute("role","tab");b.onclick=()=>{seed=7+p.id.length;show(p.id)};tabs.appendChild(b)});
DT6.forEach(d=>{const o=document.createElement("option");o.textContent=d;document.getElementById("fDtm").appendChild(o)});

const pb=document.getElementById("pbiBtn");pb.onclick=()=>{const on=document.body.classList.toggle("showpbi");pb.setAttribute("aria-pressed",on)};
let start="oport";try{const t=localStorage.getItem("pbiTab");if(PAGES.some(p=>p.id===t))start=t}catch(e){}
seed=7+start.length;show(start);
</script>
