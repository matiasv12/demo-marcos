  <head><script>/* Marco de celular: en la compu la demo se ve en tamaño móvil (misma URL) */
(function(){try{

var src=location.href;
document.documentElement.innerHTML='<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+document.title+'</title><style>'+
'html,body{margin:0;height:100%;background:#15162B;font-family:system-ui,sans-serif;overflow:hidden}'+

'.ph iframe{width:100%;height:100%;border:0;border-radius:10px 10px 42px 42px;background:#fff;display:block}'+
'.nt{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:96px;height:16px;border-radius:20px;background:#0b0b12;z-index:2;pointer-events:none}'+
'.hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#8C8FB8;font-size:12px;letter-spacing:.04em}'+
'</style></head><body><div class="st"><div class="ph" id="ph"><div class="nt"></div><iframe src="'+src.replace(/"/g,"&quot;")+'" allow="geolocation; camera"></iframe></div></div><div class="hint">Demo con datos ficticios · se ve igual que en el celular</div></body>';
function fit(){var s=Math.min(1,(innerHeight-56)/880,(innerWidth-40)/414);document.getElementById("ph").style.transform="scale("+s+")";}
fit();addEventListener("resize",fit);
}catch(e){}})();
</script>
